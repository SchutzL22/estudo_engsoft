<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>Engenharia de Software — Guia de Estudo</title>
<style>
:root{--bg:#0d1424;--bg2:#131c33;--card:#161f3a;--line:#263256;--text:#eaf0ff;--dim:#9ba8cf;--acc:#6c9bff;--acc2:#5fe0c8;--warn:#ffb454;--ok:#3ddc97;--okbg:rgba(61,220,151,.13);--bad:#ff6b81;--badbg:rgba(255,107,129,.13);--on:#0b1020;--r:16px}
:root[data-theme=light]{--bg:#f3f6fd;--bg2:#e9eefb;--card:#fff;--line:#d5ddf0;--text:#141c33;--dim:#5b6890;--acc:#3b6ef0;--acc2:#0f9d86;--warn:#b86e00;--ok:#0f8a5a;--okbg:rgba(15,138,90,.1);--bad:#d13450;--badbg:rgba(209,52,80,.09);--on:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 500px at 0 -10%,rgba(108,155,255,.16),transparent 60%),radial-gradient(800px 400px at 100% 0,rgba(95,224,200,.1),transparent 55%),var(--bg);color:var(--text);line-height:1.55;padding-bottom:calc(60px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.top{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:clamp(16px,4.2vw,22px);flex:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}
.tabs{max-width:900px;margin:10px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tab{padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-weight:700;font-size:14px;cursor:pointer}
.tab.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:var(--on);border-color:transparent}
main{max-width:900px;margin:0 auto;padding:16px 14px}
.panel{display:none}.panel.on{display:block;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.btn{padding:9px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.p{background:var(--acc);color:var(--on);border-color:transparent}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--on);border-color:transparent}
input[type=search],select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.bar{height:8px;border-radius:9px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
/* estudo */
.aula{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.aula>summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;gap:12px;align-items:center}.aula>summary::-webkit-details-marker{display:none}
.badge{flex:none;min-width:58px;padding:5px 9px;border-radius:9px;background:rgba(108,155,255,.15);color:var(--acc);font-weight:800;font-size:12px;text-align:center;border:1px solid rgba(108,155,255,.3)}
.aula h2{margin:0;font-size:16px;flex:1;line-height:1.3}.chev{transition:.2s;color:var(--dim)}.aula[open] .chev{transform:rotate(90deg)}
.body{padding:0 16px 16px}
.sec{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.sec h3{margin:0 0 8px;font-size:15px;color:var(--acc2)}
.sec p,.sec li{margin:0 0 8px;font-size:15px}.sec ul{margin:0;padding-left:20px}
.sec b.l{color:var(--text);background:rgba(108,155,255,.13);padding:1px 6px;border-radius:6px;font-weight:700}
.call{margin:8px 0;padding:10px 13px;border-radius:12px;background:rgba(255,180,84,.12);border-left:4px solid var(--warn);font-size:14.5px}.call b{color:var(--warn)}
.done{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--dim);cursor:pointer}.done input{width:18px;height:18px;accent-color:var(--acc2)}
.hl{background:rgba(255,220,80,.35);color:inherit;border-radius:3px}
.quick li{list-style:none;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}.quick{padding:0;margin:0}
.quick b{color:var(--acc)}
.frase{font-weight:700;font-size:15px;line-height:1.6;border-left:4px solid var(--acc2);padding-left:12px}
/* questões */
.q{scroll-margin-top:150px}
.qh{display:flex;gap:10px;margin-bottom:12px}.qn{flex:none;width:32px;height:32px;border-radius:9px;background:rgba(108,155,255,.15);color:var(--acc2);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(108,155,255,.3)}
.qt{font-weight:600;font-size:15.5px}.tag{display:inline-block;font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-bottom:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);text-align:left;font:inherit;font-size:14.5px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--acc);background:rgba(108,155,255,.07)}.opt:disabled{cursor:default;opacity:1}
.lt{flex:none;width:24px;height:24px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right .lt{background:var(--ok);color:var(--on);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong .lt{background:var(--bad);color:var(--on);border-color:var(--bad)}
.fb{display:none;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:14px}.fb.show{display:block}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.no{background:var(--badbg);border:1px solid var(--bad)}.fb b{display:block;margin-bottom:3px}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}.pill{padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.opts2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0 14px;font-size:13.5px;color:var(--dim)}.opts2 label{display:flex;gap:6px;align-items:center;cursor:pointer}.opts2 select{width:auto;padding:8px 10px;font-size:13px}
.res h2{margin:0 0 4px}.big{font-size:44px;font-weight:900;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.row{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}.row span:first-child{width:112px;flex:none;color:var(--dim)}.row .bar{flex:1}.row span:last-child{width:52px;text-align:right;flex:none}
.empty{text-align:center;color:var(--dim);padding:30px 10px}
#top{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:none;background:var(--acc);color:var(--on);font-size:20px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none}
@media(max-width:520px){.card{padding:14px}.qt{font-size:15px}.aula>summary{padding:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>🛠️ Engenharia de Software — Guia de Estudo</h1><button class="icon" id="theme" aria-label="Alternar tema">🌓</button></div>
  <div class="tabs" role="tablist"><button class="tab on" data-t="estudo">📖 Estudo</button><button class="tab" data-t="quest">✅ Questões</button></div>
</header>
<main>
<section id="estudo" class="panel on">
  <div class="card">
    <div class="meta"><span id="sp-t">0 de 0 temas revisados</span><span id="sp-p">0%</span></div>
    <div class="bar"><i id="sp-b"></i></div>
    <input type="search" id="busca" placeholder="🔍 Buscar termo (ex.: Scrum, Gitflow, Nielsen, MoSCoW)…" style="margin-top:12px">
  </div>
  <div class="chips" id="aulachips"></div>
  <div id="aulas"></div>
  <details class="aula" id="resumao"><summary><span class="badge">⚡</span><h2>Resumão geral — revisão de minutos antes da prova</h2><span class="chev">▶</span></summary><div class="body"><p class="frase" id="frase"></p><ul class="quick" id="rlist"></ul></div></details>
  <details class="aula" id="macetes"><summary><span class="badge">💡</span><h2>Macetes finais para a prova</h2><span class="chev">▶</span></summary><div class="body"><ul class="quick" id="mlist"></ul></div></details>
</section>

<section id="quest" class="panel">
  <div class="card">
    <div class="meta"><span id="qp-t">0 / 0 respondidas</span><span id="qp-p">0%</span></div>
    <div class="bar"><i id="qp-b"></i></div>
    <div class="stats" style="margin:12px 0 0"><span class="pill">✅ <span id="n-ok">0</span></span><span class="pill">❌ <span id="n-no">0</span></span><span class="pill" id="n-pct">—</span><button class="btn" id="reset" style="margin-left:auto">🔄 Reiniciar</button></div>
  </div>
  <div class="chips" id="qchips"></div>
  <div class="opts2">
    <select id="status" aria-label="Filtro de status"><option value="all">Todas</option><option value="open">Não respondidas</option><option value="err">Só as que errei</option></select>
    <label><input type="checkbox" id="shuf" checked> Embaralhar alternativas</label>
  </div>
  <div id="qlist"></div>
  <div class="card res" id="result" style="display:none;text-align:center"></div>
</section>
</main>
<button id="top" aria-label="Voltar ao topo">↑</button>

<script>
const D={"aulas": [{"id": 1, "title": "Conceitos: software, engenharia e qualidade", "secs": [{"title": "Software e Engenharia de Software", "items": [{"t": "p", "text": "não é só código. Envolve (1) instruções/programas, (2) estruturas de dados e (3) informação descritiva sobre operação e uso. Referência do slide: Pressman.", "label": "Software"}, {"t": "p", "text": "aplicação de uma abordagem sistemática, disciplinada e quantificada ao desenvolvimento, operação e manutenção do software. Ideias centrais: ser adaptável/ágil e manter foco na qualidade.", "label": "Engenharia de Software"}]}, {"title": "Qualidade de software", "items": [{"t": "p", "text": "totalidade das características que dão ao software a capacidade de satisfazer necessidades explícitas e implícitas.", "label": "Qualidade"}, {"t": "p", "text": "grau de conformidade de sistema, componente ou processo com seus requisitos.", "label": "Definição IEEE"}]}, {"title": "Visões de qualidade — Garvin", "items": [{"t": "li", "text": "reconhecida, mas difícil ou impossível de definir precisamente.", "label": "Transcendental"}, {"t": "li", "text": "adaptação às necessidades do usuário.", "label": "Usuário"}, {"t": "li", "text": "atendimento à especificação original.", "label": "Fabricante"}, {"t": "li", "text": "ligada às características do produto.", "label": "Produto"}, {"t": "li", "text": "relacionada ao quanto o cliente está disposto a pagar.", "label": "Baseada em valor"}]}, {"title": "Garantia da Qualidade (GQA)", "items": [{"t": "p", "text": "conjunto de atividades para avaliar o processo pelo qual os produtos são desenvolvidos. Busca dar confiança de que o produto está em conformidade com os requisitos. Envolve qualidade do PROCESSO e do PRODUTO."}, {"t": "li", "text": "padronização de documentos, auditoria, testes, coleta/análise de erros, gerenciamento de mudanças, administração de segurança e proteção.", "label": "Exemplos"}, {"t": "li", "text": "qualidade dos requisitos, do projeto, do código e eficácia do controle de qualidade.", "label": "Metas"}, {"t": "li", "text": "CMMI e MPS.BR (qualidade do processo). É possível extrair elementos de mais de uma metodologia.", "label": "Modelos"}]}, {"title": "Qualidade do produto — ISO/IEC 9126 (6 atributos)", "items": [{"t": "li", "text": "presença das funções especificadas; resultados corretos/esperados; interoperabilidade; prevenção de acesso não autorizado.", "label": "1) Funcionalidade"}, {"t": "li", "text": "baixa frequência de falha; manter desempenho diante de problemas; restabelecer desempenho; recuperar dados após falha.", "label": "2) Confiabilidade"}, {"t": "li", "text": "facilidade de compreender, aprender e usar.", "label": "3) Usabilidade"}, {"t": "li", "text": "tempo de resposta e quantidade de recursos necessários.", "label": "4) Eficiência"}, {"t": "li", "text": "esforço para modificar, risco de efeitos inesperados e esforço para testar depois da modificação; também diagnosticar deficiências.", "label": "5) Manutenibilidade"}, {"t": "li", "text": "adaptação a outros ambientes operacionais; esforço para instalar/substituir.", "label": "6) Portabilidade"}, {"t": "call", "label": "Macete", "text": "F C U E M P = Funcionalidade, Confiabilidade, Usabilidade, Eficiência, Manutenibilidade, Portabilidade."}]}, {"title": "Qualidade × satisfação do cliente", "items": [{"t": "p", "text": "Satisfação do cliente se relaciona a: produto conforme especificações, boa qualidade, entrega no prazo e não ultrapassar o orçamento."}, {"t": "li", "text": "menos manutenção/correções, menos suporte, possibilidade de realocar a equipe e mais segurança.", "label": "Fabricante ganha"}, {"t": "li", "text": "mais agilidade no processo.", "label": "Cliente/usuário ganha"}]}, {"title": "Ideia do “bom o suficiente”", "items": [{"t": "p", "text": "Desenvolver um software bom o suficiente, já prevendo uma V2.0. A V1.0 pode ter limitações/erros conhecidos, dependendo do contexto e da área de aplicação."}, {"t": "call", "label": "Cuidado", "text": "Isso não significa ignorar qualidade; a decisão precisa considerar riscos e o domínio da aplicação."}]}]}, {"id": 2, "title": "Ergonomia e usabilidade", "secs": [{"title": "Definições", "items": [{"t": "p", "text": "estudo das interações e trabalhos entre humanos e demais elementos.", "label": "Ergonomia"}, {"t": "p", "text": "capacidade de um produto ser usado por usuários específicos para atingir objetivos específicos com eficácia, eficiência e satisfação em um contexto específico. Em termos simples: facilidade de usar algo.", "label": "Usabilidade (ISO 9241)"}]}, {"title": "Fatores de usabilidade", "items": [{"t": "li", "text": "aprender a usar e lembrar das funções com facilidade.", "label": "Aprendizagem/memorização"}, {"t": "li", "text": "quão bem o sistema faz aquilo que se propõe a fazer.", "label": "Eficiência"}, {"t": "li", "text": "proteção do usuário contra situações indesejadas.", "label": "Segurança"}, {"t": "li", "text": "usuário consegue realizar o que precisa e recebe orientação adequada.", "label": "Satisfação"}]}]}, {"id": 3, "title": "Heurísticas de Nielsen", "secs": [{"title": "As 10 heurísticas", "items": [{"t": "li", "text": "dar feedback instantâneo sobre o que está acontecendo. Ex.: carregamento, sucesso, processamento.", "label": "1. Visibilidade do status do sistema"}, {"t": "li", "text": "usar linguagem e conceitos familiares ao usuário (ex.: “lixeira”).", "label": "2. Relacionamento entre interface e mundo real"}, {"t": "li", "text": "usuário pode abortar uma tarefa ou desfazer uma operação.", "label": "3. Liberdade e controle do usuário"}, {"t": "li", "text": "mesma linguagem e mesmo padrão para ações equivalentes (ex.: mesmo ícone de salvar em todas as telas).", "label": "4. Consistência"}, {"t": "li", "text": "evitar que erros aconteçam, conhecendo interfaces que geram falhas e modificando-as (ex.: confirmar antes de apagar).", "label": "5. Prevenção de erros"}, {"t": "li", "text": "mostrar ações/opções disponíveis para o usuário não precisar lembrar de comandos ou estados anteriores.", "label": "6. Reconhecimento ao invés de recordação"}, {"t": "li", "text": "simples para iniciantes e ágil para avançados (ex.: atalhos).", "label": "7. Flexibilidade e eficiência de uso"}, {"t": "li", "text": "mostrar exatamente a informação necessária naquele momento, nem mais nem menos.", "label": "8. Estética e design minimalista"}, {"t": "li", "text": "mensagens claras explicam o problema e ajudam a resolvê-lo.", "label": "9. Ajude a reconhecer, diagnosticar e sanar erros"}, {"t": "li", "text": "o sistema idealmente é intuitivo, mas quando a ajuda for necessária ela deve estar facilmente acessível.", "label": "10. Ajuda e documentação"}, {"t": "call", "label": "Ordem de memória", "text": "Status → Mundo real → Controle → Consistência → Prevenção → Reconhecimento → Flexibilidade → Minimalismo → Erros → Ajuda."}]}]}, {"id": 4, "title": "Ciclos de vida", "secs": [{"title": "Conceitos", "items": [{"t": "p", "text": "vai de uma ideia até o produto final. As etapas compõem o processo de desenvolvimento. Pode ser visto como um conjunto de fases; em geral a última é a deterioração e morte do produto.", "label": "Ciclo de vida"}, {"t": "p", "text": "artefatos/documentos/modelos criados durante o desenvolvimento.", "label": "Produtos de trabalho"}, {"t": "p", "text": "Cascata, Incremental, Evolutivo, Espiral e Teste em V (este apresentado junto à parte de testes).", "label": "Modelos citados"}]}, {"title": "Cascata", "items": [{"t": "li", "text": "subprocessos executados em sequência, com pontos de controle bem definidos (facilita a gestão)."}, {"t": "li", "text": "é rígido e burocrático; exige domínio dos subprocessos."}, {"t": "li", "text": "no modelo básico, não prevê correção em fases anteriores."}, {"t": "li", "text": "“Cascata com realimentação” permite revisar a fase anterior e é apresentada como mais realista."}]}, {"title": "Incremental", "items": [{"t": "li", "text": "entrega partes funcionais do sistema em incrementos; combina fluxos linear e paralelo."}, {"t": "li", "text": "o primeiro incremento é um produto essencial liberado ao cliente."}, {"t": "li", "text": "a avaliação de um incremento ajuda a planejar o próximo; repete-se até o produto completo."}]}, {"title": "Evolutivo", "items": [{"t": "li", "text": "usa prototipagem evolutiva: o protótipo ajuda os envolvidos a compreender o que será construído."}, {"t": "li", "text": "serve como mecanismo para identificar requisitos; o produto cresce e muda ao longo do desenvolvimento."}]}, {"title": "Espiral", "items": [{"t": "li", "text": "modelo iterativo; cada ciclo termina com revisão."}, {"t": "li", "text": "fortemente centrado na análise de riscos, tratados ao longo dos ciclos (ajuda na qualidade)."}, {"t": "call", "label": "Macete", "text": "Cascata = sequência/rigidez · Incremental = partes · Evolutivo = protótipo/crescimento · Espiral = iteração + risco."}]}]}, {"id": 5, "title": "Teste em V e níveis de teste", "secs": [{"title": "Ideia central", "items": [{"t": "p", "text": "Verificar o software em diferentes níveis, do menor componente ao produto usado/validado pelo usuário. Sequência: Unidade → Integração → Sistema → Aceitação."}]}, {"title": "Teste de unidade", "items": [{"t": "li", "text": "testa as menores unidades do software (método, classe ou grupo de classes)."}, {"t": "li", "text": "realizado pelo desenvolvedor, normalmente em ambiente de desenvolvimento."}, {"t": "li", "text": "se bem planejado/executado, pode detectar cerca de 70% dos defeitos que seriam encontrados pelos usuários."}]}, {"title": "Teste de integração", "items": [{"t": "li", "text": "integra componentes que já passaram pelo teste de unidade; feito por desenvolvedor ou testador; testa módulos/subsistemas em conjunto."}, {"t": "li", "text": "em integração incremental o sistema cresce em pequenos incrementos — erros tendem a ser mais fáceis de isolar e corrigir."}, {"t": "p", "text": "Necessário porque componentes isolados podem funcionar, mas gerar problemas quando combinados: perda de dados, efeitos inesperados de um componente sobre outro, imprecisões que se tornam relevantes no conjunto, problemas com dados globais."}]}, {"title": "Teste de sistema", "items": [{"t": "p", "text": "Testa o sistema como um todo, realizado pelo testador, em ambiente de teste com características semelhantes às de produção. Pode envolver:"}, {"t": "li", "text": "faz o software falhar de várias maneiras e verifica se a recuperação ocorre corretamente. Se for automática, avalia-se a correção; se exige intervenção humana, avalia-se o tempo médio de reparo.", "label": "Recuperação"}, {"t": "li", "text": "verifica se os mecanismos de proteção realmente protegem contra ataques indevidos. Objetivo: tornar o custo da invasão maior que o valor das informações.", "label": "Segurança"}, {"t": "li", "text": "submete o sistema a quantidade, frequência ou volume anormais de recursos, para descobrir até onde suporta antes de falhar.", "label": "Esforço / Stress"}, {"t": "li", "text": "verifica conformidade com requisitos de desempenho em tempo de execução; frequentemente associado ao teste de esforço. O desempenho real depende da integração de todo o sistema.", "label": "Desempenho"}, {"t": "li", "text": "exercita o software nos diferentes ambientes em que deverá operar (configurações de hardware e software).", "label": "Disponibilização"}]}, {"title": "Teste de aceitação", "items": [{"t": "li", "text": "permite ao cliente validar os requisitos; conduzido pelo usuário."}, {"t": "li", "text": "considera que usuários podem usar o sistema de maneiras não previstas (combinações de dados e interpretação das instruções revelam problemas)."}]}, {"title": "Alfa × Beta", "items": [{"t": "li", "text": "grupo selecionado de usuários; a equipe observa como usam; bugs e problemas de uso são registrados; ambiente CONTROLADO.", "label": "Alfa"}, {"t": "li", "text": "liberado para alguns clientes; a equipe não observa diretamente; o cliente registra erros/problemas; ambiente NÃO controlado.", "label": "Beta"}, {"t": "call", "label": "Pegadinha", "text": "Stress não é teste de segurança. E desempenho ≠ stress: desempenho verifica requisitos de desempenho; stress força condições anormais."}]}]}, {"id": 6, "title": "Tabela de decisão", "secs": [{"title": "O que é", "items": [{"t": "p", "text": "Técnica de teste de condições lógicas baseada em regras de negócio. Ajuda a levantar e criar casos de teste a partir das combinações possíveis de condições."}]}, {"title": "Três elementos", "items": [{"t": "li", "text": "cada condição aparece em uma linha com um valor conhecido.", "label": "Condições"}, {"t": "li", "text": "mostram o que será realizado no processo.", "label": "Ações"}, {"t": "li", "text": "combinações das condições que levam a ações; devem esgotar as possibilidades relevantes; cada regra é uma coluna.", "label": "Regras"}]}, {"title": "Vantagens", "items": [{"t": "li", "text": "relacionar claramente condições e ações;"}, {"t": "li", "text": "verificar redundâncias e incompletudes;"}, {"t": "li", "text": "produzir documentação breve e detalhada."}]}]}, {"id": 7, "title": "Métodos ágeis e Manifesto Ágil", "secs": [{"title": "Agilidade", "items": [{"t": "p", "text": "Equipe ágil é rápida e capaz de responder adequadamente às mudanças. A filosofia vem do Manifesto Ágil."}]}, {"title": "Quatro valores do Manifesto", "items": [{"t": "li", "text": "Indivíduos e interações > processos e ferramentas"}, {"t": "li", "text": "Software em funcionamento > documentação abrangente"}, {"t": "li", "text": "Colaboração com o cliente > negociação de contratos"}, {"t": "li", "text": "Responder a mudanças > seguir um plano"}, {"t": "call", "label": "Atenção", "text": "Os itens da direita NÃO são considerados inúteis; o manifesto afirma que os da esquerda são mais valorizados. Sempre “mais que”, nunca “em vez de”."}]}, {"title": "Princípios destacados nos slides", "items": [{"t": "li", "text": "maior prioridade: satisfazer o cliente por entrega contínua e adiantada de software com valor;"}, {"t": "li", "text": "mudanças de requisitos são bem-vindas, mesmo tardiamente;"}, {"t": "li", "text": "entregar software funcionando frequentemente, em ciclos curtos;"}, {"t": "li", "text": "pessoas de negócio e desenvolvedores trabalham juntos diariamente;"}, {"t": "li", "text": "projetos construídos em torno de indivíduos motivados, com ambiente e suporte adequados;"}, {"t": "li", "text": "comunicação face a face é muito eficiente;"}, {"t": "li", "text": "software funcionando é a medida primária de progresso;"}, {"t": "li", "text": "desenvolvimento sustentável: manter ritmo constante;"}, {"t": "li", "text": "atenção contínua à excelência técnica e ao bom design aumenta a agilidade;"}, {"t": "li", "text": "simplicidade (maximizar a quantidade de trabalho não realizado) é essencial;"}, {"t": "li", "text": "as melhores arquiteturas, requisitos e designs emergem de equipes auto-organizáveis;"}, {"t": "li", "text": "em intervalos regulares, a equipe reflete e ajusta seu comportamento para ficar mais eficaz."}]}]}, {"id": 8, "title": "Scrum", "secs": [{"title": "O que é", "items": [{"t": "li", "text": "criado por Jeff Sutherland na década de 90 (conforme o slide); método de desenvolvimento ágil, coerente com o Manifesto."}, {"t": "li", "text": "é um FRAMEWORK: orienta atividades de requisitos, análise, projeto, evolução e entrega."}, {"t": "li", "text": "empírico e iterativo: melhoria contínua e experimentação controlada."}, {"t": "li", "text": "origem do nome: rugby — trabalho unido e colaborativo, todos têm importância."}, {"t": "p", "text": "construir de forma correta, construir a coisa certa e construir de forma rápida.", "label": "Três ideias"}]}, {"title": "Pilares (3)", "items": [{"t": "li", "text": "processo e trabalho devem ser visíveis; promove confiança e permite decisões.", "label": "Transparência"}, {"t": "li", "text": "artefatos e progresso são inspecionados com frequência para identificar variações, problemas e impedimentos.", "label": "Inspeção"}, {"t": "li", "text": "quando algo sai dos limites aceitáveis ou o produto fica inadequado, processo/material deve ser ajustado.", "label": "Adaptação"}]}, {"title": "Valores (5)", "items": [{"t": "li", "text": "time se compromete com objetivos e apoia os colegas.", "label": "Compromisso"}, {"t": "li", "text": "trabalho da Sprint direcionado às metas.", "label": "Foco"}, {"t": "li", "text": "transparência sobre trabalho e desafios.", "label": "Abertura"}, {"t": "li", "text": "membros reconhecem capacidade e autonomia uns dos outros.", "label": "Respeito"}, {"t": "li", "text": "fazer o correto e enfrentar problemas difíceis.", "label": "Coragem"}, {"t": "call", "label": "Não confunda", "text": "Transparência, inspeção e adaptação = PILARES. Compromisso, foco, abertura, respeito e coragem = VALORES."}]}, {"title": "Papéis", "items": [{"t": "li", "text": "líder/facilitador; conduz a equipe de modo coerente; responsável por estabelecer o Scrum conforme o Guia do Scrum.", "label": "Scrum Master"}, {"t": "li", "text": "domínio do negócio; informa O QUE deve ser feito; desenvolve/comunica a meta do produto; cria/comunica e ORDENA os itens do Product Backlog; garante que o Product Backlog seja transparente, visível e compreensível.", "label": "Product Owner (PO)"}, {"t": "li", "text": "domínio técnico; informa COMO será feito; cria o plano da Sprint/Sprint Backlog; adere à Definição de Pronto; adapta o plano diariamente; responsabiliza-se mutuamente.", "label": "Equipe de desenvolvimento"}]}, {"title": "Características do time", "items": [{"t": "li", "text": "auto-organizável;"}, {"t": "li", "text": "pequeno: 3 a 9 membros (segundo o slide);"}, {"t": "li", "text": "multidisciplinar: possui as habilidades necessárias para entregar o produto."}]}, {"title": "História de usuário e Sprint", "items": [{"t": "p", "text": "descrição simples e informal de uma funcionalidade. Estrutura: “Eu como <usuário> preciso/quero/gostaria <recurso> para <razão>.”", "label": "História de usuário"}, {"t": "p", "text": "iteração de 2 a 4 semanas no fluxo dos slides; funcionalidades são selecionadas/priorizadas e atribuídas à Sprint.", "label": "Sprint"}, {"t": "p", "text": "requisitos → análise → implementação → teste → validação → liberação.", "label": "Da ideia à entrega"}]}]}, {"id": 9, "title": "Eventos e artefatos do Scrum", "secs": [{"title": "Artefatos (3)", "items": [{"t": "li", "text": "lista organizada de requisitos/funcionalidades desejadas e necessárias; itens no topo têm maior prioridade; evolui com o desenvolvimento e o feedback. A Sprint Zero é citada como momento de criar o Product Backlog.", "label": "Product Backlog (PBL)"}, {"t": "li", "text": "tarefas (SBIs) que o time estima conseguir realizar em uma Sprint; é criado durante o Sprint Planning.", "label": "Sprint Backlog (SBL)"}, {"t": "li", "text": "é o entregável; pode ser validado pelo PO; o slide o destaca como o artefato mais importante.", "label": "Incremento do Produto"}]}, {"title": "Eventos (4)", "items": [{"t": "li", "text": "PO e time alinham o que será entregue; o time detalha tecnicamente cada PBI e elabora o SBL, considerando o PBL priorizado e a disponibilidade de horas da equipe.", "label": "Sprint Planning"}, {"t": "li", "text": "reunião diária de 15 minutos; evita problemas de comunicação. Perguntas: o que foi feito? o que será feito? há dificuldades?", "label": "Daily Scrum"}, {"t": "li", "text": "foco na qualidade e melhoria do PRODUTO; apresenta PBIs e coleta feedback.", "label": "Sprint Review"}, {"t": "li", "text": "foco na qualidade e melhoria do PROCESSO; avalia os eventos do Sprint, gera/atualiza backlog de melhorias e usa feedback para melhorar a próxima Sprint.", "label": "Retrospectiva"}, {"t": "call", "label": "Memorize", "text": "Review = PRODUTO. Retrospectiva = PROCESSO."}]}]}, {"id": 10, "title": "Backlog, priorização e matrizes", "secs": [{"title": "Product Backlog", "items": [{"t": "p", "text": "Lista organizada de funcionalidades, melhorias e correções que o produto deve ter. Pode mudar conforme evolução e feedback."}]}, {"title": "Por que priorizar?", "items": [{"t": "li", "text": "nem tudo pode ser feito ao mesmo tempo;"}, {"t": "li", "text": "recursos são limitados: tempo, equipe e orçamento;"}, {"t": "li", "text": "priorizar é escolher o que entrega mais valor e mais rápido."}]}, {"title": "Matriz Impacto × Esforço", "items": [{"t": "p", "text": "Ferramenta para analisar e priorizar itens considerando impacto/valor e esforço necessário. A lógica é confrontar benefício esperado com custo/esforço."}]}, {"title": "MoSCoW", "items": [{"t": "li", "text": "deve ter / obrigatório.", "label": "Must"}, {"t": "li", "text": "deveria ter / importante, mas não necessariamente obrigatório.", "label": "Should"}, {"t": "li", "text": "poderia ter / desejável.", "label": "Could"}, {"t": "li", "text": "não será feito neste ciclo/escopo.", "label": "Won’t"}]}]}, {"id": 11, "title": "Definition of Done (DoD) — Definição de Pronto", "secs": [{"title": "Conceito", "items": [{"t": "li", "text": "cria transparência por dar entendimento compartilhado sobre o que significa trabalho concluído no Incremento;"}, {"t": "li", "text": "deve ser definida ANTES do início da Sprint;"}, {"t": "li", "text": "deve considerar a visão técnica e a de negócio."}]}, {"title": "Se um item não atende à DoD", "items": [{"t": "li", "text": "não pode ser liberado;"}, {"t": "li", "text": "não deve ser apresentado na Sprint Review;"}, {"t": "li", "text": "retorna ao Product Backlog para consideração futura."}]}, {"title": "Exemplo do slide: “Adicionar produto ao carrinho”", "items": [{"t": "p", "text": "Só está pronto quando, entre outros: o botão funciona; o produto é adicionado corretamente no backend; o carrinho é atualizado; o frontend reflete a mudança; testes verificam a atualização do estoque; outro desenvolvedor revisou; a documentação do fluxo está atualizada."}, {"t": "call", "label": "Pegadinha", "text": "DoD não é “quando terminou a programação”: é o conjunto de critérios compartilhados que define o trabalho concluído."}]}]}, {"id": 12, "title": "Manutenção de software", "secs": [{"title": "Ideia central", "items": [{"t": "p", "text": "Mesmo seguindo processos, falhas aparecem e são detectadas. A manutenção começa assim que o produto é lançado e a fila tende a crescer."}]}, {"title": "Tipos de manutenção", "items": [{"t": "li", "text": "remove defeitos existentes. NÃO altera requisitos.", "label": "1) Corretiva"}, {"t": "li", "text": "adiciona melhorias solicitadas pelos usuários. Altera a documentação de requisitos.", "label": "2) Evolutiva"}, {"t": "li", "text": "adequa o produto a necessidades do negócio; pode envolver interface e pequenas alterações nos requisitos. Altera a documentação de requisitos.", "label": "3) Adaptativa"}, {"t": "li", "text": "procura pontos em que o código pode ser melhorado (desempenho, robustez, confiabilidade ou segurança). NÃO altera requisitos.", "label": "4) Preventiva"}]}, {"title": "Manutenção no ciclo de vida", "items": [{"t": "p", "text": "Citando Robert L. Glass: estimativa de 40% a 80% dos custos de software vão para manutenção. Dentro da estimativa do slide: 60% evolutiva, 17% corretiva, 18% adaptativa e 5% outros tipos."}, {"t": "p", "text": "Quanto melhor o produto, mais utilizado ele pode ser e maior tende a ser seu ciclo de vida."}]}, {"title": "Manutenibilidade", "items": [{"t": "li", "text": "indicativo qualitativo da facilidade de corrigir, adaptar ou melhorar o software."}, {"t": "li", "text": "quanto mais difícil entender o programa, mais difícil mantê-lo."}, {"t": "li", "text": "qualidade do código, documentação e versionamento são técnicas importantes."}]}]}, {"id": 13, "title": "Gestão de configuração", "secs": [{"title": "Por que existe?", "items": [{"t": "p", "text": "Mudanças são inevitáveis: novos negócios/condições de mercado, novas necessidades de clientes, alteração de prioridades/escopo e restrições orçamentárias."}, {"t": "p", "text": "Toda mudança deve ser analisada e registrada antes da implementação, comunicada aos envolvidos e controlada para garantir qualidade."}]}, {"title": "O que é", "items": [{"t": "li", "text": "coordenar o desenvolvimento para minimizar confusão: identificar, organizar e controlar modificações no software em construção."}, {"t": "li", "text": "objetivo: maximizar produtividade minimizando erros."}, {"t": "li", "text": "aplica-se do início do projeto até o final do ciclo de vida; é atividade de apoio, rastreamento e controle, voltada à qualidade."}, {"t": "li", "text": "deve identificar alteração, controlar alteração, garantir implementação correta e notificar os envolvidos."}]}, {"title": "Riscos da falta de controle", "items": [{"t": "li", "text": "versão antiga substituir indevidamente a versão nova;"}, {"t": "li", "text": "perda de artefatos, como requisitos ou código;"}, {"t": "li", "text": "dificuldade para descobrir por que alterações foram feitas."}]}, {"title": "Benefícios", "items": [{"t": "li", "text": "controle do produto, do desenvolvimento e das versões;"}, {"t": "li", "text": "rastreabilidade: quem, quando e por quê;"}, {"t": "li", "text": "histórico de evolução do sistema."}, {"t": "call", "label": "Não confunda", "text": "Gestão de configuração NÃO impede modificações, não é só para times grandes e não é apenas controle de versão."}]}]}, {"id": 14, "title": "Gitflow", "secs": [{"title": "Visão geral", "items": [{"t": "p", "text": "Modelo alternativo de ramificação do Git. Trabalha com ramificações de recursos e várias ramificações primárias."}]}, {"title": "Branches", "items": [{"t": "li", "text": "guarda o histórico do lançamento oficial; commits podem ser marcados com número de versão.", "label": "main"}, {"t": "li", "text": "ramificação de integração dos recursos; complementa a main.", "label": "develop"}, {"t": "li", "text": "cada novo recurso fica em sua própria ramificação; depois é integrado ao fluxo de desenvolvimento.", "label": "feature"}, {"t": "li", "text": "criada a partir de develop quando há recursos suficientes ou a data de lançamento se aproxima. Depois de criada, NÃO entram novos recursos. Serve para correções de segurança, documentação e tarefas de lançamento. Pronta, vai para a main e recebe número de versão.", "label": "release"}, {"t": "li", "text": "branch de manutenção usada para corrigir rapidamente lançamentos em produção.", "label": "hotfix"}, {"t": "call", "label": "Memória rápida", "text": "main = oficial/produção · develop = integração · feature = novo recurso · release = preparar lançamento · hotfix = correção urgente em produção."}]}]}, {"id": 15, "title": "OKR e métricas", "secs": [{"title": "OKR = Objectives and Key Results", "items": [{"t": "p", "text": "Ferramenta de engajamento planejada/implementada por áreas e colaboradores."}, {"t": "li", "text": "o que queremos alcançar; inspira, direciona e motiva. É QUALITATIVO.", "label": "Objective"}, {"t": "li", "text": "como saberemos que alcançamos. São métricas mensuráveis, QUANTITATIVAS.", "label": "Key Results (KRs)"}]}, {"title": "Regras dos slides", "items": [{"t": "li", "text": "no máximo 5 objetivos por área/colaborador;"}, {"t": "li", "text": "cada objetivo com no máximo 4 Key Results;"}, {"t": "li", "text": "KRs quantitativos, mensuráveis e desafiadores;"}, {"t": "li", "text": "possíveis de alcançar em 3 meses;"}, {"t": "li", "text": "objetivos ousados/desafiadores, mas possíveis de alcançar;"}, {"t": "li", "text": "OKRs acessíveis a todos."}]}, {"title": "Exemplo do slide: app de programação", "items": [{"t": "p", "text": "entregar um MVP funcional capaz de gerar aprendizagem real em poucos minutos por dia.", "label": "Objetivo"}, {"t": "li", "text": "concluir 100% do fluxo principal;", "label": "KR"}, {"t": "li", "text": "publicar 20 micro-aulas de até 3 minutos;", "label": "KR"}, {"t": "li", "text": "atingir pelo menos 80% de aprovação em usabilidade;", "label": "KR"}, {"t": "li", "text": "zero bugs críticos e menos de 5 bugs menores no MVP final.", "label": "KR"}]}, {"title": "Métricas citadas", "items": [{"t": "li", "text": "mede satisfação.", "label": "NPS"}, {"t": "li", "text": "taxa de cancelamento/abandono.", "label": "Churn"}, {"t": "li", "text": "custo de aquisição do cliente.", "label": "CAC"}, {"t": "li", "text": "percentual de pessoas que realizam a ação desejada.", "label": "Taxa de conversão"}, {"t": "li", "text": "exemplos: tempo de uso diário e cliques.", "label": "Engajamento"}]}]}], "resumo": ["SOFTWARE = programas + dados + informação descritiva.", "ENGENHARIA DE SOFTWARE = abordagem sistemática, disciplinada e quantificada.", "QUALIDADE = atender necessidades explícitas/implícitas e requisitos.", "GQA = avaliar/garantir a qualidade do processo e do produto.", "ISO/IEC 9126 = funcionalidade, confiabilidade, usabilidade, eficiência, manutenibilidade, portabilidade (F C U E M P).", "USABILIDADE = eficácia + eficiência + satisfação em contexto específico.", "NIELSEN = status, mundo real, controle, consistência, prevenção, reconhecimento, flexibilidade, minimalismo, erros claros, ajuda/documentação.", "CASCATA = sequência e rigidez.", "INCREMENTAL = entrega por partes.", "EVOLUTIVO = protótipos + requisitos + produto que cresce.", "ESPIRAL = iteração + revisão + risco.", "TESTES = unidade (menor parte) → integração (partes juntas) → sistema (todo) → aceitação (cliente/usuário valida).", "RECUPERAÇÃO / SEGURANÇA / STRESS / DESEMPENHO / DISPONIBILIZAÇÃO = testes de sistema (falha e volta · proteção · limite anormal · requisitos de desempenho · diferentes ambientes).", "ALFA = controlado + observado. BETA = cliente + não controlado.", "MANIFESTO ÁGIL = 4 valores: indivíduos/interações, software funcionando, colaboração com o cliente, responder a mudanças (sempre “mais que”, não “em vez de”).", "PILARES DO SCRUM = transparência, inspeção, adaptação.", "VALORES DO SCRUM = compromisso, foco, abertura, respeito, coragem.", "PO = o que / valor / ordenação do backlog.", "TIME = como fazer / execução técnica; auto-organizável, pequeno (3 a 9), multidisciplinar.", "SCRUM MASTER = estabelece/facilita o Scrum.", "ARTEFATOS = Product Backlog, Sprint Backlog, Incremento.", "EVENTOS = Planning, Daily (15 min), Review (produto + feedback), Retrospectiva (processo + melhoria).", "SPRINT = 2 a 4 semanas (conforme os slides).", "PRIORIZAÇÃO = recursos limitados; Impacto × Esforço compara benefício e esforço; MoSCoW = Must, Should, Could, Won’t.", "DoD = entendimento compartilhado do concluído; definida antes da Sprint; sem DoD não libera e não apresenta na Review.", "MANUTENÇÃO = corretiva (defeito), evolutiva (melhoria/requisito novo), adaptativa (adequação ao negócio), preventiva (estrutura interna).", "GESTÃO DE CONFIGURAÇÃO = mudança analisada, registrada, comunicada e controlada; foco em rastreabilidade; não é só versionamento.", "GITFLOW = main (oficial), develop (integração), feature (recurso), release (preparação), hotfix (correção urgente).", "OKR = Objective qualitativo; Key Result quantitativo; até 5 objetivos, até 4 KRs por objetivo, horizonte de 3 meses."], "frase": "QUALIDADE É ATENDER REQUISITOS; AGILIDADE É RESPONDER A MUDANÇAS; SCRUM É TRANSPARÊNCIA + INSPEÇÃO + ADAPTAÇÃO; REVIEW É PRODUTO E RETROSPECTIVA É PROCESSO; MUDANÇA SE CONTROLA, NÃO SE PROÍBE", "macetes": ["Manifesto Ágil NÃO diz “documentação não presta”: valoriza mais software funcionando do que documentação abrangente.", "Scrum é FRAMEWORK, não “metodologia rígida” no sentido apresentado pelos slides.", "Transparência, inspeção e adaptação = PILARES. Compromisso, foco, abertura, respeito e coragem = VALORES.", "PO responde “O QUE / valor / ordenação”. Time de desenvolvimento responde “COMO fazer”.", "Review = PRODUTO. Retrospectiva = PROCESSO.", "Daily = 15 minutos no material. Sprint = 2 a 4 semanas no fluxo apresentado.", "Product Backlog ≠ Sprint Backlog: PBL é a lista do produto; SBL são as tarefas selecionadas para a Sprint.", "Incremento = entregável; o slide o destaca como o artefato mais importante.", "DoD não é “quando terminou a programação”: é o conjunto de critérios compartilhados que define o trabalho concluído.", "Corretiva = corrigir defeito. Evolutiva = melhorar/adicionar. Adaptativa = adequar ao negócio. Preventiva = melhorar internamente para evitar problemas.", "Gestão de configuração NÃO impede mudanças: identifica, organiza, controla, rastreia e comunica.", "Gitflow: main = oficial · develop = integração · feature = recurso · release = preparação do lançamento · hotfix = correção urgente em produção.", "OKR: Objective = QUALITATIVO. Key Result = QUANTITATIVO.", "NPS mede satisfação · Churn mede abandono/cancelamento · CAC mede custo de aquisição · Conversão mede realização da ação desejada · Engajamento pode envolver tempo de uso e cliques.", "Testes: Unidade = pequeno · Integração = conjunto de componentes · Sistema = sistema inteiro · Aceitação = usuário/cliente.", "Alfa = controlado + observado. Beta = não controlado + cliente registra problemas.", "Stress não é “teste de segurança”: leva o sistema a condições anormais de carga/recursos.", "Teste de desempenho não é igual a stress: desempenho verifica requisitos de desempenho; stress força condições anormais.", "Cascata = sequência e rigidez · Incremental = entrega por partes · Evolutivo = protótipo/crescimento · Espiral = iteração + risco.", "ISO/IEC 9126: funcionalidade, confiabilidade, usabilidade, eficiência, manutenibilidade, portabilidade."], "qs": [{"n": 1, "q": "Segundo o material, software é composto por:", "o": {"A": "Apenas código-fonte e banco de dados.", "B": "Programas, hardware e usuários.", "C": "Instruções, estruturas de dados e informação descritiva.", "D": "Requisitos, cronograma e orçamento.", "E": "Apenas interfaces e documentação."}, "c": "C", "e": "O slide define software por instruções, estruturas de dados e informação descritiva.", "a": "A"}, {"n": 2, "q": "Engenharia de Software é definida no material como:", "o": {"A": "Uso exclusivo de linguagens orientadas a objetos.", "B": "Aplicação de uma abordagem sistemática, disciplinada e quantificada ao desenvolvimento, operação e manutenção do software.", "C": "Processo de documentação de sistemas.", "D": "Controle exclusivo de qualidade.", "E": "Administração de servidores."}, "c": "B", "e": "Engenharia de Software é apresentada como abordagem sistemática, disciplinada e quantificada.", "a": "A"}, {"n": 3, "q": "Qual alternativa representa a definição de qualidade de software apresentada?", "o": {"A": "Somente ausência de bugs.", "B": "Apenas atendimento do prazo.", "C": "Totalidade de características que permite ao software satisfazer necessidades explícitas e implícitas.", "D": "Quantidade de funcionalidades.", "E": "Complexidade do código."}, "c": "C", "e": "Qualidade inclui capacidade de satisfazer necessidades explícitas e implícitas.", "a": "A"}, {"n": 4, "q": "Na visão de qualidade “usuário”, segundo Garvin, qualidade é:", "o": {"A": "Atendimento às especificações originais.", "B": "Adaptação às necessidades do usuário.", "C": "Valor de venda.", "D": "Número de características do produto.", "E": "Facilidade de manutenção."}, "c": "B", "e": "Na visão do usuário, qualidade é adaptação às necessidades do usuário.", "a": "A"}, {"n": 5, "q": "Na visão “fabricante”, qualidade está ligada:", "o": {"A": "À satisfação emocional do usuário.", "B": "À aparência da interface.", "C": "Ao atendimento da especificação original.", "D": "Ao custo de aquisição.", "E": "À quantidade de documentação."}, "c": "C", "e": "A visão do fabricante está ligada ao atendimento da especificação original.", "a": "A"}, {"n": 6, "q": "Qual é uma atividade de garantia da qualidade citada nos slides?", "o": {"A": "Troca do sistema operacional do cliente.", "B": "Auditoria.", "C": "Compra de hardware.", "D": "Criação obrigatória de microserviços.", "E": "Contratação de usuários."}, "c": "B", "e": "Auditoria aparece explicitamente entre as atividades de garantia da qualidade.", "a": "A"}, {"n": 7, "q": "A garantia da qualidade envolve:", "o": {"A": "Apenas qualidade do produto.", "B": "Apenas qualidade do processo.", "C": "Qualidade do processo e qualidade do produto.", "D": "Apenas qualidade do código.", "E": "Apenas testes de aceitação."}, "c": "C", "e": "GQA envolve qualidade do processo e do produto.", "a": "A"}, {"n": 8, "q": "Qual opção NÃO pertence aos seis atributos de qualidade do produto citados segundo ISO/IEC 9126?", "o": {"A": "Funcionalidade.", "B": "Confiabilidade.", "C": "Usabilidade.", "D": "Rentabilidade.", "E": "Portabilidade."}, "c": "D", "e": "Rentabilidade não aparece entre os seis atributos da ISO/IEC 9126 citados.", "a": "A"}, {"n": 9, "q": "Tempo de resposta e quantidade de recursos necessários estão associados principalmente a:", "o": {"A": "Eficiência.", "B": "Portabilidade.", "C": "Funcionalidade.", "D": "Usabilidade.", "E": "Corretiva."}, "c": "A", "e": "Tempo de resposta e recursos necessários são associados à eficiência.", "a": "A"}, {"n": 10, "q": "Esforço para realizar modificações e testar o software modificado está relacionado principalmente a:", "o": {"A": "Eficiência.", "B": "Manutenibilidade.", "C": "Portabilidade.", "D": "Funcionalidade.", "E": "Segurança."}, "c": "B", "e": "Facilidade e esforço de modificação/teste são pontos de manutenibilidade.", "a": "A"}, {"n": 11, "q": "Adaptação do produto para outros ambientes operacionais está ligada a:", "o": {"A": "Portabilidade.", "B": "Confiabilidade.", "C": "Eficiência.", "D": "Usabilidade.", "E": "Satisfação."}, "c": "A", "e": "Adaptar o software a outros ambientes é portabilidade.", "a": "A"}, {"n": 12, "q": "Segundo os slides, ergonomia é:", "o": {"A": "Estudo de linguagens de programação.", "B": "Estudo das interações e trabalhos entre humanos e demais elementos.", "C": "Estudo de bancos de dados.", "D": "Controle de versões.", "E": "Gerenciamento de projetos."}, "c": "B", "e": "Essa é a definição de ergonomia apresentada no slide.", "a": "A"}, {"n": 13, "q": "Usabilidade, conforme ISO 9241 no material, envolve:", "o": {"A": "Apenas velocidade.", "B": "Eficácia, eficiência e satisfação em contexto específico de uso.", "C": "Somente satisfação do usuário.", "D": "Apenas segurança.", "E": "Apenas facilidade de aprendizado."}, "c": "B", "e": "Usabilidade é avaliada por eficácia, eficiência e satisfação em contexto específico.", "a": "A"}, {"n": 14, "q": "Um sistema que mostra claramente “Salvando...” e depois “Arquivo salvo” aplica principalmente qual heurística?", "o": {"A": "Consistência.", "B": "Visibilidade do status do sistema.", "C": "Flexibilidade e eficiência.", "D": "Reconhecimento ao invés de recordação.", "E": "Ajuda e documentação."}, "c": "B", "e": "O sistema informa continuamente seu estado.", "a": "A"}, {"n": 15, "q": "Um aplicativo que usa “Lixeira” para representar a exclusão de arquivos está mais relacionado a:", "o": {"A": "Mundo real.", "B": "Prevenção de erros.", "C": "Minimalismo.", "D": "Consistência.", "E": "Segurança."}, "c": "A", "e": "“Lixeira” é um conceito familiar do mundo real.", "a": "A"}, {"n": 16, "q": "Um botão “Desfazer” após uma ação do usuário exemplifica:", "o": {"A": "Liberdade e controle do usuário.", "B": "Eficiência.", "C": "Portabilidade.", "D": "Mundo real.", "E": "Ajuda."}, "c": "A", "e": "Desfazer e abortar dão controle ao usuário.", "a": "A"}, {"n": 17, "q": "Usar sempre o mesmo ícone para salvar em diferentes telas está relacionado a:", "o": {"A": "Segurança.", "B": "Consistência.", "C": "Recuperação.", "D": "Stress.", "E": "Adaptativa."}, "c": "B", "e": "Mesma ação apresentada consistentemente segue a heurística de consistência.", "a": "A"}, {"n": 18, "q": "Pedir confirmação antes de apagar permanentemente um arquivo é um exemplo de:", "o": {"A": "Reconhecimento ao invés de recordação.", "B": "Prevenção de erros.", "C": "Desenvolvimento evolutivo.", "D": "Flexibilidade.", "E": "Portabilidade."}, "c": "B", "e": "Confirmação antes de ação destrutiva busca prevenir erro.", "a": "A"}, {"n": 19, "q": "Mostrar no menu as opções disponíveis, em vez de exigir que o usuário memorize comandos, corresponde a:", "o": {"A": "Reconhecimento ao invés de recordação.", "B": "Mundo real.", "C": "Consistência.", "D": "Disponibilização.", "E": "Confiabilidade."}, "c": "A", "e": "O usuário reconhece opções em vez de lembrar comandos.", "a": "A"}, {"n": 20, "q": "Um sistema simples para iniciantes, mas com atalhos para usuários avançados, exemplifica:", "o": {"A": "Estética e design minimalista.", "B": "Flexibilidade e eficiência de uso.", "C": "Segurança.", "D": "Confiabilidade.", "E": "Portabilidade."}, "c": "B", "e": "Iniciantes + usuários avançados = flexibilidade e eficiência de uso.", "a": "A"}, {"n": 21, "q": "Remover textos e informações desnecessárias de uma tela para deixar apenas o essencial está relacionado a:", "o": {"A": "Estética e design minimalista.", "B": "Teste de integração.", "C": "Segurança.", "D": "Mundo real.", "E": "Sprint Review."}, "c": "A", "e": "Minimalismo significa mostrar somente a informação necessária.", "a": "A"}, {"n": 22, "q": "Uma mensagem “Senha inválida. Verifique os caracteres e tente novamente.” está mais relacionada a:", "o": {"A": "Ajuda o usuário a reconhecer, diagnosticar e sanar erros.", "B": "Controle do usuário.", "C": "Portabilidade.", "D": "Incremental.", "E": "Hotfix."}, "c": "A", "e": "Mensagem clara ajuda a reconhecer, diagnosticar e resolver o erro.", "a": "A"}, {"n": 23, "q": "Um sistema é intuitivo, mas ainda oferece uma central de ajuda facilmente acessível. Qual heurística está diretamente relacionada?", "o": {"A": "Ajuda e documentação.", "B": "Consistência.", "C": "Stress.", "D": "Confiabilidade.", "E": "Evolutiva."}, "c": "A", "e": "Ajuda e documentação devem estar acessíveis quando necessárias.", "a": "A"}, {"n": 24, "q": "No modelo Cascata:", "o": {"A": "Tudo é feito aleatoriamente.", "B": "Subprocessos são executados em sequência.", "C": "O produto é sempre entregue em pequenos incrementos.", "D": "O risco é o único foco.", "E": "Prototipagem é obrigatória."}, "c": "B", "e": "Cascata trabalha com subprocessos em sequência.", "a": "B"}, {"n": 25, "q": "Uma característica do Cascata destacada nos slides é:", "o": {"A": "Flexibilidade máxima.", "B": "Ausência de pontos de controle.", "C": "Rigidez e burocracia.", "D": "Entregas diárias obrigatórias.", "E": "Auto-organização."}, "c": "C", "e": "O material caracteriza o Cascata como rígido e burocrático.", "a": "B"}, {"n": 26, "q": "A versão do Cascata com realimentação:", "o": {"A": "Não permite revisão.", "B": "Permite revisar a fase anterior.", "C": "Elimina testes.", "D": "É igual ao Scrum.", "E": "É exclusiva para manutenção."}, "c": "B", "e": "A realimentação permite revisão da fase anterior.", "a": "B"}, {"n": 27, "q": "O modelo Incremental:", "o": {"A": "Entrega somente quando todo o software estiver pronto.", "B": "Libera incrementos funcionais e usa avaliações para planejar os seguintes.", "C": "É centrado somente em riscos.", "D": "Proíbe feedback.", "E": "Não permite melhorias."}, "c": "B", "e": "Incremental libera partes funcionais e aprende com avaliações anteriores.", "a": "B"}, {"n": 28, "q": "No modelo Evolutivo, o protótipo é usado principalmente como:", "o": {"A": "Produto final obrigatório.", "B": "Mecanismo para ajudar a compreender e identificar requisitos.", "C": "Branch de lançamento.", "D": "Banco de dados.", "E": "Ferramenta de controle financeiro."}, "c": "B", "e": "O protótipo ajuda a compreender e identificar requisitos.", "a": "B"}, {"n": 29, "q": "O modelo Espiral é especialmente conhecido no material por ser:", "o": {"A": "Centrado na análise de risco.", "B": "Exclusivamente documental.", "C": "Baseado apenas em protótipos descartáveis.", "D": "Sem iteração.", "E": "Sem revisão."}, "c": "A", "e": "A análise de risco é o foco destacado do modelo Espiral.", "a": "B"}, {"n": 30, "q": "O teste de unidade verifica:", "o": {"A": "Todo o sistema em produção.", "B": "As menores unidades do software.", "C": "Apenas a interface do usuário.", "D": "Apenas segurança.", "E": "Somente infraestrutura."}, "c": "B", "e": "Unidade testa a menor parte do software.", "a": "B"}, {"n": 31, "q": "Um teste de integração é necessário mesmo após testes de unidade porque:", "o": {"A": "Unidade nunca encontra defeitos.", "B": "Componentes podem funcionar isoladamente e apresentar problemas quando integrados.", "C": "Integração substitui o teste de aceitação.", "D": "Integração serve apenas para documentar.", "E": "Unidade e integração são exatamente iguais."}, "c": "B", "e": "Integração revela efeitos que não aparecem quando componentes são testados isoladamente.", "a": "B"}, {"n": 32, "q": "Qual situação é um exemplo de problema de integração?", "o": {"A": "Um método isolado não compila.", "B": "Dois componentes funcionam sozinhos, mas um altera dados de forma inesperada no outro.", "C": "Um usuário não conhece o sistema.", "D": "Uma branch possui nome errado.", "E": "Um objetivo é qualitativo."}, "c": "B", "e": "Interações inesperadas entre componentes são problemas típicos de integração.", "a": "B"}, {"n": 33, "q": "O teste de sistema:", "o": {"A": "Testa apenas métodos.", "B": "Testa o sistema como um todo.", "C": "É feito somente pelo Product Owner.", "D": "Ocorre obrigatoriamente em produção.", "E": "Substitui o teste de unidade."}, "c": "B", "e": "Teste de sistema verifica o sistema como um todo.", "a": "B"}, {"n": 34, "q": "No teste de recuperação, o software é:", "o": {"A": "Avaliado apenas quanto à estética.", "B": "Forçado a falhar de várias formas para verificar a recuperação.", "C": "Avaliado apenas quanto ao custo.", "D": "Liberado para clientes.", "E": "Alterado para adicionar funcionalidades."}, "c": "B", "e": "O sistema é forçado a falhar para avaliar sua recuperação.", "a": "B"}, {"n": 35, "q": "Se a recuperação do sistema exige intervenção humana, o material indica avaliar:", "o": {"A": "Tempo médio de reparo.", "B": "Número de features.", "C": "NPS.", "D": "CAC.", "E": "Tamanho do backlog."}, "c": "A", "e": "Quando há intervenção humana, o slide cita tempo médio de reparo.", "a": "B"}, {"n": 36, "q": "O teste de segurança busca verificar:", "o": {"A": "Se o código está bonito.", "B": "Se os mecanismos de proteção defendem o sistema contra ataques indevidos.", "C": "Se o usuário gosta da interface.", "D": "Se o produto cabe no orçamento.", "E": "Se o backlog está priorizado."}, "c": "B", "e": "Segurança testa os mecanismos de proteção contra ataques indevidos.", "a": "B"}, {"n": 37, "q": "O objetivo do teste de segurança, segundo o slide, inclui:", "o": {"A": "Garantir que nunca haverá invasão.", "B": "Tornar o custo da invasão maior que o valor das informações.", "C": "Eliminar todos os usuários.", "D": "Substituir testes de unidade.", "E": "Evitar mudanças."}, "c": "B", "e": "O material destaca tornar a invasão mais cara que o valor das informações.", "a": "B"}, {"n": 38, "q": "Teste de esforço/stress significa:", "o": {"A": "Usar o sistema em situações anormais de carga/recursos.", "B": "Testar apenas telas.", "C": "Verificar somente documentação.", "D": "Validar requisitos com o cliente.", "E": "Avaliar apenas portabilidade."}, "c": "A", "e": "Stress usa cargas/volumes/frequências anormais.", "a": "B"}, {"n": 39, "q": "O teste de desempenho busca principalmente:", "o": {"A": "Verificar requisitos de desempenho em tempo de execução.", "B": "Criar histórias de usuário.", "C": "Organizar branches.", "D": "Priorizar backlog.", "E": "Criar OKRs."}, "c": "A", "e": "Desempenho verifica requisitos de desempenho em execução.", "a": "B"}, {"n": 40, "q": "O teste de disponibilização verifica:", "o": {"A": "O sistema somente no computador do desenvolvedor.", "B": "Se o software funciona nos diferentes ambientes em que deverá operar.", "C": "Apenas o banco de dados.", "D": "Somente as regras de negócio.", "E": "Apenas a velocidade do servidor."}, "c": "B", "e": "Disponibilização verifica diferentes ambientes de hardware/software.", "a": "B"}, {"n": 41, "q": "O teste de aceitação é conduzido principalmente:", "o": {"A": "Pelo usuário/cliente.", "B": "Pelo compilador.", "C": "Pelo Git.", "D": "Pelo Scrum Master.", "E": "Pelo administrador de redes."}, "c": "A", "e": "O teste de aceitação é conduzido pelo usuário/cliente.", "a": "B"}, {"n": 42, "q": "Qual é a principal diferença apresentada entre Alfa e Beta?", "o": {"A": "Alfa é em ambiente controlado e observado; Beta é em ambiente não controlado, com clientes registrando problemas.", "B": "Alfa sempre ocorre em produção e Beta no laboratório.", "C": "Alfa é apenas de segurança e Beta apenas de desempenho.", "D": "Alfa usa desenvolvedores; Beta usa apenas máquinas.", "E": "Não há diferença."}, "c": "A", "e": "Alfa é controlado e observado; Beta é não controlado e conta com clientes.", "a": "B"}, {"n": 43, "q": "Uma tabela de decisão é especialmente útil para:", "o": {"A": "Definir logotipo.", "B": "Testar combinações de condições e regras de negócio.", "C": "Criar branches do Git.", "D": "Medir satisfação.", "E": "Definir o Scrum Master."}, "c": "B", "e": "Tabela de decisão organiza condições, ações e regras.", "a": "B"}, {"n": 44, "q": "Na tabela de decisão, as regras representam:", "o": {"A": "Apenas nomes de usuários.", "B": "Combinações de condições que resultam em ações.", "C": "Documentos da empresa.", "D": "Recursos do computador.", "E": "Resultados financeiros."}, "c": "B", "e": "Regras são combinações de condições que resultam em ações.", "a": "B"}, {"n": 45, "q": "Qual alternativa apresenta corretamente um valor do Manifesto Ágil?", "o": {"A": "Processos e ferramentas mais que indivíduos e interações.", "B": "Documentação abrangente mais que software funcionando.", "C": "Negociação de contratos mais que colaboração com o cliente.", "D": "Responder a mudanças mais que seguir um plano.", "E": "Planejamento mais que entrega."}, "c": "D", "e": "Esse é um dos quatro valores do Manifesto.", "a": "C"}, {"n": 46, "q": "Quando o Manifesto Ágil valoriza software funcionando mais que documentação abrangente, isso significa que:", "o": {"A": "Documentação deve ser eliminada.", "B": "Documentação não possui valor.", "C": "Software funcionando recebe maior valorização, embora documentação continue podendo ter valor.", "D": "Documentação é proibida.", "E": "Só importa programação."}, "c": "C", "e": "O Manifesto não elimina documentação; apenas valoriza mais o software funcionando.", "a": "C"}, {"n": 47, "q": "Uma equipe recebe uma mudança de requisito no final do projeto e busca incorporá-la. Isso está alinhado ao princípio de:", "o": {"A": "Rejeitar mudanças.", "B": "Mudanças são bem-vindas, mesmo tardiamente.", "C": "Priorizar documentação.", "D": "Eliminar feedback.", "E": "Evitar contato com o cliente."}, "c": "B", "e": "Mudanças são bem-vindas mesmo tardiamente.", "a": "C"}, {"n": 48, "q": "“Software funcionando é a medida primária de progresso” é:", "o": {"A": "Um princípio apresentado nos slides.", "B": "Um artefato do Scrum.", "C": "Uma heurística de Nielsen.", "D": "Um tipo de manutenção.", "E": "Uma métrica de OKR."}, "c": "A", "e": "É um princípio do desenvolvimento ágil apresentado.", "a": "C"}, {"n": 49, "q": "Pessoas de negócio e desenvolvedores devem:", "o": {"A": "Trabalhar separados.", "B": "Trabalhar diariamente em conjunto durante o projeto.", "C": "Se comunicar apenas por contrato.", "D": "Conversar somente no final.", "E": "Evitar contato direto."}, "c": "B", "e": "Negócio e desenvolvimento devem trabalhar juntos diariamente.", "a": "C"}, {"n": 50, "q": "O princípio relacionado à excelência técnica afirma que:", "o": {"A": "Excelência técnica é irrelevante.", "B": "Atenção contínua à excelência técnica e bom design aumenta a agilidade.", "C": "Design deve ser evitado.", "D": "Código não importa.", "E": "Apenas velocidade importa."}, "c": "B", "e": "Excelência técnica e bom design aumentam a agilidade.", "a": "C"}, {"n": 51, "q": "“Simplicidade” no material é apresentada como:", "o": {"A": "Eliminar todo o planejamento.", "B": "Maximizar a quantidade de trabalho não realizado.", "C": "Fazer o máximo de funcionalidades possíveis.", "D": "Criar sistemas mais complexos.", "E": "Evitar feedback."}, "c": "B", "e": "Simplicidade é descrita como maximizar a quantidade de trabalho não realizado.", "a": "C"}, {"n": 52, "q": "Em intervalos regulares, uma equipe ágil deve:", "o": {"A": "Ignorar os próprios erros.", "B": "Refletir sobre como se tornar mais eficaz e ajustar seu comportamento.", "C": "Parar o projeto.", "D": "Trocar todos os membros.", "E": "Eliminar requisitos."}, "c": "B", "e": "A equipe deve refletir e adaptar seu comportamento.", "a": "C"}, {"n": 53, "q": "Scrum é apresentado nos slides como:", "o": {"A": "Uma linguagem.", "B": "Um framework ágil.", "C": "Um sistema operacional.", "D": "Um modelo de banco de dados.", "E": "Um protocolo de rede."}, "c": "B", "e": "Scrum é apresentado como framework de desenvolvimento ágil.", "a": "D"}, {"n": 54, "q": "Os três pilares do Scrum são:", "o": {"A": "Planejamento, código e teste.", "B": "Transparência, inspeção e adaptação.", "C": "Foco, coragem e respeito.", "D": "PO, SM e desenvolvedor.", "E": "Backlog, Sprint e Release."}, "c": "B", "e": "Transparência, inspeção e adaptação são os três pilares.", "a": "D"}, {"n": 55, "q": "A inspeção no Scrum serve para:", "o": {"A": "Impedir qualquer mudança.", "B": "Detectar variações, problemas e impedimentos com frequência.", "C": "Substituir a Daily.", "D": "Garantir documentação total.", "E": "Criar o Product Backlog."}, "c": "B", "e": "Inspeção procura variações, problemas e impedimentos.", "a": "D"}, {"n": 56, "q": "Adaptação no Scrum significa:", "o": {"A": "Nunca alterar o processo.", "B": "Ajustar processo ou materiais quando algo sai dos limites aceitáveis ou o produto é inadequado.", "C": "Cancelar todas as Sprints.", "D": "Trocar de framework.", "E": "Ignorar feedback."}, "c": "B", "e": "Adaptação significa ajustar o processo/material quando necessário.", "a": "D"}, {"n": 57, "q": "Qual alternativa contém apenas valores do Scrum?", "o": {"A": "Compromisso, foco, abertura, respeito e coragem.", "B": "Segurança, portabilidade, eficiência e coragem.", "C": "Transparência, inspeção, adaptação e foco.", "D": "Must, Should, Could e Won’t.", "E": "Main, Develop, Release e Hotfix."}, "c": "A", "e": "Esses cinco são os valores do Scrum.", "a": "D"}, {"n": 58, "q": "O Product Owner é principalmente associado a:", "o": {"A": "Domínio técnico e escolha de linguagem.", "B": "Domínio do negócio e ordenação do Product Backlog.", "C": "Administração do servidor.", "D": "Teste de unidade.", "E": "Controle do sistema operacional."}, "c": "B", "e": "PO tem domínio do negócio e ordena o Product Backlog.", "a": "D"}, {"n": 59, "q": "A equipe de desenvolvimento informa principalmente:", "o": {"A": "O que o mercado quer.", "B": "Como o trabalho será feito tecnicamente.", "C": "Quanto o cliente deve pagar.", "D": "Qual será o contrato.", "E": "Qual será a campanha de marketing."}, "c": "B", "e": "O time tem domínio técnico e informa como será feito.", "a": "D"}, {"n": 60, "q": "O Scrum Master, segundo o material:", "o": {"A": "É o dono do produto.", "B": "É responsável por estabelecer o Scrum conforme o Guia do Scrum.", "C": "É o único programador.", "D": "Decide sozinho os requisitos.", "E": "Escreve todos os testes."}, "c": "B", "e": "Essa responsabilidade é explicitamente atribuída ao Scrum Master.", "a": "D"}, {"n": 61, "q": "Uma característica do time de desenvolvimento apresentada é:", "o": {"A": "Ser obrigatoriamente grande.", "B": "Ser auto-organizável.", "C": "Ser formado apenas por programadores.", "D": "Ter exatamente 20 membros.", "E": "Não possuir autonomia."}, "c": "B", "e": "O time é descrito como auto-organizável.", "a": "D"}, {"n": 62, "q": "Conforme o slide, o time de desenvolvimento é:", "o": {"A": "Pequeno, de 3 a 9 membros, e multidisciplinar.", "B": "Sempre de 2 membros.", "C": "Sempre de 10 a 20.", "D": "Formado apenas por gerentes.", "E": "Obrigatoriamente remoto."}, "c": "A", "e": "O slide indica time pequeno, de 3 a 9, e multidisciplinar.", "a": "D"}, {"n": 63, "q": "A estrutura “Eu como <usuário> quero <recurso> para <razão>” é típica de:", "o": {"A": "OKR.", "B": "História de usuário.", "C": "Gitflow.", "D": "DoD.", "E": "Teste de recuperação."}, "c": "B", "e": "Esse formato é a história de usuário.", "a": "D"}, {"n": 64, "q": "Qual conjunto contém apenas artefatos do Scrum apresentados?", "o": {"A": "Product Backlog, Sprint Backlog e Incremento do Produto.", "B": "Daily, Review e Retrospectiva.", "C": "Main, Develop e Hotfix.", "D": "Objective, KR e NPS.", "E": "Unidade, Integração e Sistema."}, "c": "A", "e": "São os três artefatos apresentados nos slides.", "a": "E"}, {"n": 65, "q": "O Product Backlog:", "o": {"A": "É fixo e nunca muda.", "B": "É uma lista organizada de funcionalidades, melhorias e correções e evolui com feedback.", "C": "Contém apenas tarefas técnicas.", "D": "É criado pelo cliente e nunca ordenado.", "E": "É o mesmo que Sprint Backlog."}, "c": "B", "e": "Product Backlog é uma lista dinâmica de funcionalidades, melhorias e correções.", "a": "E"}, {"n": 66, "q": "O Sprint Backlog é:", "o": {"A": "O conjunto de tarefas que o time estima conseguir fazer na Sprint.", "B": "A lista de todos os requisitos do produto.", "C": "O histórico de versões.", "D": "A lista de métricas da empresa.", "E": "A definição de qualidade."}, "c": "A", "e": "Sprint Backlog reúne tarefas estimadas para a Sprint.", "a": "E"}, {"n": 67, "q": "Qual evento tem como objetivo principal alinhar o que será entregue na Sprint e criar o Sprint Backlog?", "o": {"A": "Daily Scrum.", "B": "Sprint Planning.", "C": "Sprint Review.", "D": "Retrospectiva.", "E": "Teste de aceitação."}, "c": "B", "e": "Planning alinha a entrega e cria o SBL.", "a": "E"}, {"n": 68, "q": "Qual evento é descrito no material como uma reunião diária de 15 minutos?", "o": {"A": "Sprint Planning.", "B": "Daily Scrum.", "C": "Sprint Review.", "D": "Retrospectiva.", "E": "Release."}, "c": "B", "e": "Daily é a reunião diária de 15 minutos.", "a": "E"}, {"n": 69, "q": "A Sprint Review está mais diretamente ligada a:", "o": {"A": "Qualidade e melhoria do produto, com feedback.", "B": "Melhoria exclusiva do processo interno.", "C": "Gestão de configuração.", "D": "Criação de branches.", "E": "Definição de OKRs."}, "c": "A", "e": "Review olha o produto e coleta feedback.", "a": "E"}, {"n": 70, "q": "A Retrospectiva está mais diretamente ligada a:", "o": {"A": "Qualidade e melhoria do processo.", "B": "Liberação para produção.", "C": "Validação de requisitos pelo cliente.", "D": "Criação de Product Backlog.", "E": "Teste de segurança."}, "c": "A", "e": "Retrospectiva olha o processo e as melhorias.", "a": "E"}, {"n": 71, "q": "Qual associação está CORRETA?", "o": {"A": "Review = processo; Retrospectiva = produto.", "B": "Review = produto; Retrospectiva = processo.", "C": "Review = segurança; Retrospectiva = código.", "D": "Review = backlog; Retrospectiva = contrato.", "E": "Review = release; Retrospectiva = hotfix."}, "c": "B", "e": "Review = produto; Retrospectiva = processo.", "a": "E"}, {"n": 72, "q": "A Definition of Done serve para:", "o": {"A": "Definir salário da equipe.", "B": "Criar entendimento compartilhado sobre o que significa trabalho concluído.", "C": "Escolher o Product Owner.", "D": "Classificar usuários.", "E": "Criar branches."}, "c": "B", "e": "DoD define entendimento compartilhado do que está realmente pronto.", "a": "E"}, {"n": 73, "q": "A DoD deve ser definida:", "o": {"A": "Depois que a Sprint termina.", "B": "Antes de iniciar a Sprint.", "C": "Somente após o lançamento.", "D": "Apenas em produção.", "E": "Somente em caso de bugs."}, "c": "B", "e": "Deve ser definida antes de iniciar a Sprint.", "a": "E"}, {"n": 74, "q": "Um PBI não atende à Definition of Done. Segundo o material, ele:", "o": {"A": "Deve ser liberado mesmo assim.", "B": "Pode ser apresentado na Review como concluído.", "C": "Retorna ao Product Backlog e não pode ser liberado ou tratado como pronto.", "D": "Deve ir para hotfix.", "E": "Deve virar OKR."}, "c": "C", "e": "Sem DoD, não está pronto; volta ao Product Backlog.", "a": "E"}, {"n": 75, "q": "Por que priorizar o Product Backlog?", "o": {"A": "Porque recursos são ilimitados.", "B": "Porque tudo deve ser feito ao mesmo tempo.", "C": "Porque tempo, equipe e orçamento são limitados.", "D": "Porque o backlog não muda.", "E": "Porque somente o Scrum Master decide."}, "c": "C", "e": "Prioridade existe porque recursos são limitados.", "a": "F"}, {"n": 76, "q": "A matriz Impacto x Esforço compara principalmente:", "o": {"A": "Satisfação x segurança.", "B": "Benefício/impacto x esforço necessário.", "C": "Tempo x documentação.", "D": "Código x banco.", "E": "Risco x contrato."}, "c": "B", "e": "A matriz confronta impacto/benefício com esforço.", "a": "F"}, {"n": 77, "q": "Na técnica MoSCoW, “Must” representa:", "o": {"A": "Item opcional.", "B": "Item que não será feito.", "C": "Item que deve ter/é obrigatório.", "D": "Item que poderia ser feito.", "E": "Item apenas experimental."}, "c": "C", "e": "Must indica item obrigatório/que deve ter.", "a": "F"}, {"n": 78, "q": "Uma correção de bug existente sem alteração dos requisitos é manutenção:", "o": {"A": "Evolutiva.", "B": "Adaptativa.", "C": "Preventiva.", "D": "Corretiva.", "E": "Incremental."}, "c": "D", "e": "Correção de defeito sem alterar requisitos = corretiva.", "a": "F"}, {"n": 79, "q": "Adicionar uma melhoria solicitada por usuários, alterando a documentação de requisitos, é manutenção:", "o": {"A": "Corretiva.", "B": "Evolutiva.", "C": "Preventiva.", "D": "Adaptativa.", "E": "De segurança."}, "c": "B", "e": "Melhoria pedida pelo usuário com alteração dos requisitos = evolutiva.", "a": "F"}, {"n": 80, "q": "Adequar o produto a novas necessidades do negócio é manutenção:", "o": {"A": "Adaptativa.", "B": "Corretiva.", "C": "Preventiva.", "D": "De unidade.", "E": "Evolutiva."}, "c": "A", "e": "Adequação às necessidades do negócio = adaptativa.", "a": "F"}, {"n": 81, "q": "Melhorar o código para aumentar robustez, confiabilidade ou segurança, sem alterar requisitos, é:", "o": {"A": "Evolutiva.", "B": "Preventiva.", "C": "Adaptativa.", "D": "Corretiva.", "E": "De aceitação."}, "c": "B", "e": "Melhorias internas sem mudar requisitos = preventiva.", "a": "F"}, {"n": 82, "q": "Manutenibilidade é:", "o": {"A": "Quantidade de desenvolvedores.", "B": "Facilidade de corrigir, adaptar ou melhorar o software.", "C": "Número de usuários.", "D": "Velocidade do computador.", "E": "Quantidade de requisitos."}, "c": "B", "e": "Manutenibilidade é facilidade de corrigir, adaptar ou melhorar.", "a": "F"}, {"n": 83, "q": "A gestão de configuração busca principalmente:", "o": {"A": "Impedir mudanças.", "B": "Identificar, organizar e controlar modificações, maximizando produtividade e minimizando erros.", "C": "Eliminar documentação.", "D": "Substituir o Scrum.", "E": "Criar somente branches."}, "c": "B", "e": "Gestão de configuração organiza e controla mudanças para reduzir confusão/erros.", "a": "F"}, {"n": 84, "q": "Uma mudança, segundo o material, deve:", "o": {"A": "Ser implementada imediatamente sem registro.", "B": "Ser analisada e registrada antes, comunicada e controlada.", "C": "Ser escondida da equipe.", "D": "Ser feita só pelo usuário.", "E": "Ser feita somente em produção."}, "c": "B", "e": "Mudança deve ser analisada, registrada, comunicada e controlada.", "a": "F"}, {"n": 85, "q": "Qual é um benefício da gestão de configuração?", "o": {"A": "Rastreabilidade de quem, quando e por que.", "B": "Proibição de alterações.", "C": "Eliminação de testes.", "D": "Redução obrigatória do número de usuários.", "E": "Remoção do histórico."}, "c": "A", "e": "Rastreabilidade de quem, quando e por que é benefício explícito.", "a": "F"}, {"n": 86, "q": "O que a falta de gestão de configuração pode causar?", "o": {"A": "Histórico mais claro.", "B": "Versão antiga substituir indevidamente uma nova.", "C": "Mais rastreabilidade.", "D": "Menos risco de perda.", "E": "Menos confusão."}, "c": "B", "e": "Sem controle, versão antiga pode substituir indevidamente a nova.", "a": "F"}, {"n": 87, "q": "É correto afirmar que gestão de configuração:", "o": {"A": "É apenas controle de versão.", "B": "Só serve para software grande.", "C": "Não impede modificações; ela controla e organiza as modificações.", "D": "Existe só no início do projeto.", "E": "Não envolve rastreabilidade."}, "c": "C", "e": "Gestão de configuração não impede mudanças; controla e rastreia.", "a": "F"}, {"n": 88, "q": "No Gitflow, a branch main:", "o": {"A": "Integra features em desenvolvimento.", "B": "Guarda o histórico do lançamento oficial.", "C": "É criada para cada usuário.", "D": "Só serve para testes unitários.", "E": "É a branch de hotfix exclusivamente."}, "c": "B", "e": "main mantém o histórico do lançamento oficial.", "a": "G"}, {"n": 89, "q": "No Gitflow, a branch develop:", "o": {"A": "Armazena apenas o lançamento oficial.", "B": "Serve como ramificação de integração dos recursos.", "C": "É usada somente para documentação.", "D": "Nunca recebe features.", "E": "Substitui a main na produção."}, "c": "B", "e": "develop é a integração dos recursos.", "a": "G"}, {"n": 90, "q": "Uma nova funcionalidade deve ficar em:", "o": {"A": "feature.", "B": "release.", "C": "hotfix.", "D": "main.", "E": "OKR."}, "c": "A", "e": "Feature é a branch de um novo recurso.", "a": "G"}, {"n": 91, "q": "Depois que a branch release é criada:", "o": {"A": "Novos recursos entram normalmente.", "B": "Nenhuma atividade pode ocorrer.", "C": "Ficam apenas tarefas relacionadas ao lançamento, como segurança e documentação; novos recursos não são adicionados.", "D": "A branch vira Product Backlog.", "E": "Ela substitui a main."}, "c": "C", "e": "Release é estabilização/preparação do lançamento, sem novos recursos.", "a": "G"}, {"n": 92, "q": "A branch hotfix é usada para:", "o": {"A": "Preparar uma nova ideia.", "B": "Corrigir rapidamente lançamentos em produção.", "C": "Criar métricas.", "D": "Fazer a Daily.", "E": "Criar histórias de usuário."}, "c": "B", "e": "Hotfix corrige rapidamente produção.", "a": "G"}, {"n": 93, "q": "Em OKR, Objective é:", "o": {"A": "Quantitativo e mensurável.", "B": "Qualitativo: o que queremos alcançar.", "C": "O custo do cliente.", "D": "O número de bugs.", "E": "A taxa de churn."}, "c": "B", "e": "Objective é qualitativo e descreve onde se quer chegar.", "a": "G"}, {"n": 94, "q": "Em OKR, Key Results são:", "o": {"A": "Apenas ideias inspiradoras.", "B": "Resultados quantitativos e mensuráveis que mostram se o objetivo foi alcançado.", "C": "Branches.", "D": "Histórias de usuário.", "E": "Artefatos do Scrum."}, "c": "B", "e": "Key Results medem objetivamente o alcance do objetivo.", "a": "G"}, {"n": 95, "q": "Segundo os slides, um objetivo de OKR pode ter no máximo:", "o": {"A": "2 Key Results.", "B": "3 Key Results.", "C": "4 Key Results.", "D": "5 Key Results.", "E": "10 Key Results."}, "c": "C", "e": "Cada objetivo pode ter no máximo 4 KRs.", "a": "G"}, {"n": 96, "q": "Segundo os slides, devem existir no máximo:", "o": {"A": "5 objetivos por área/colaborador.", "B": "10 objetivos.", "C": "20 objetivos.", "D": "3 objetivos.", "E": "1 objetivo."}, "c": "A", "e": "O slide cita no máximo 5 objetivos por área/colaborador.", "a": "G"}, {"n": 97, "q": "O horizonte citado nos slides para atingir OKRs é:", "o": {"A": "1 semana.", "B": "1 mês.", "C": "3 meses.", "D": "6 meses.", "E": "1 ano."}, "c": "C", "e": "O horizonte indicado é de 3 meses.", "a": "G"}, {"n": 98, "q": "Qual opção associa corretamente a métrica?", "o": {"A": "Churn = custo de aquisição.", "B": "CAC = custo de aquisição do cliente.", "C": "NPS = taxa de abandono.", "D": "Conversão = número de branches.", "E": "Engajamento = número de requisitos."}, "c": "B", "e": "CAC significa custo de aquisição do cliente.", "a": "G"}, {"n": 99, "q": "Churn é:", "o": {"A": "Taxa de cancelamento ou abandono.", "B": "Satisfação.", "C": "Custo de aquisição.", "D": "Taxa de conversão.", "E": "Tempo de resposta."}, "c": "A", "e": "Churn é taxa de cancelamento/abandono.", "a": "G"}, {"n": 100, "q": "A taxa de conversão representa:", "o": {"A": "Percentual de pessoas que realizam uma ação desejada.", "B": "Número de bugs críticos.", "C": "Custo de aquisição.", "D": "Quantidade de colaboradores.", "E": "Tempo de manutenção."}, "c": "A", "e": "Conversão é o percentual que realiza a ação desejada.", "a": "G"}]};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='engsoft_v1';
let S={done:{},ans:{},seed:1,shuf:true,open:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const AN={"A": "Qualidade", "B": "Ciclos/Testes", "C": "Ágil", "D": "Scrum", "E": "Eventos/DoD", "F": "Manutenção", "G": "Gitflow/OKR"};

/* tema */
const th=localStorage.getItem('ss_theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');
document.documentElement.dataset.theme=th;
$('#theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('ss_theme',n)}catch(e){}};

/* abas */
