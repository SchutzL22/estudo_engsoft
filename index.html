<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f7">
<title>Engenharia de Software — Revisão para a prova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&display=swap" rel="stylesheet">
<style>
:root{--z:1;--hh:64px;--navh:62px;
  --bg:#f3f5f7;--grid:rgba(31,79,216,.075);--surface:#fff;--ink:#141c27;--dim:#4f5c6e;--line:#cdd5df;
  --accent:#1f4fd8;--on:#fff;--mark:#ffe45c;--ok:#0b7a4b;--okbg:#e2f4ea;--bad:#b4233a;--badbg:#fbe7ea;
  --hd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --bd:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark]{--bg:#0f151d;--grid:rgba(126,166,255,.07);--surface:#17202b;--ink:#e9eef5;--dim:#a2afc0;--line:#2d3b4b;
  --accent:#86adff;--on:#0b1220;--mark:rgba(255,221,60,.4);--ok:#52d79c;--okbg:rgba(82,215,156,.12);--bad:#ff8196;--badbg:rgba(255,129,150,.12)}
*{box-sizing:border-box}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;font:400 calc(1.0625rem*var(--z))/1.55 var(--bd);color:var(--ink);
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 28px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:760px;margin:0 auto;height:var(--hh);display:flex;align-items:center;gap:8px;padding:0 14px}
h1{margin:0;flex:1;min-width:0;font:800 clamp(1.08rem,5.2vw,1.3rem)/1.1 var(--hd);letter-spacing:-.01em}
h1 small{display:block;margin-top:3px;font:400 .8rem/1 var(--bd);color:var(--dim);letter-spacing:0}
.ib{width:46px;height:46px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;display:grid;place-items:center;font-weight:700}
.ib:hover{border-color:var(--accent)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:var(--dim);cursor:pointer;font-size:.82rem;font-weight:700;position:relative}
nav button svg{width:24px;height:24px}
nav button[aria-selected=true]{color:var(--accent)}
nav button[aria-selected=true]::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent);border-radius:0 0 3px 3px}
@media(min-width:800px){
  nav{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top));max-width:732px;margin:14px auto 0;border:1px solid var(--line);border-radius:8px;padding:0}
  nav button{flex-direction:row;min-height:50px;gap:8px;font-size:.95rem}
  nav button[aria-selected=true]::before{top:auto;bottom:-1px;left:12%;right:12%;border-radius:3px 3px 0 0}
  body{padding-bottom:60px}
  html{scroll-padding-top:150px}
}

main{max-width:760px;margin:0 auto;padding:16px 14px}
.panel{display:none}.panel.on{display:block}
h2{font-family:var(--hd);margin:0}
mark{background:linear-gradient(transparent 52%,var(--mark) 52%);color:inherit;padding:0 .12em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:8px 2px;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Estudar */
.rv{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:700}
.rv span{white-space:nowrap}
.meter{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.srow{display:flex;gap:8px;margin-bottom:16px}
input[type=search]{flex:1;min-width:0;min-height:46px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1rem}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
.topic[open]{border-color:var(--accent)}
.topic>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:64px;cursor:pointer;list-style:none}
.topic>summary::-webkit-details-marker{display:none}
.chk{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid var(--dim);background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.chk svg{width:20px;height:20px}
.topic.rev .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.tt{flex:1;min-width:0}
.tt b{display:block;font:700 1.12rem/1.25 var(--hd)}
.tt span{display:block;color:var(--dim);font-size:.9rem;line-height:1.35;margin-top:2px}
.chev{flex:none;width:10px;height:10px;border-right:2.5px solid var(--dim);border-bottom:2.5px solid var(--dim);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.topic[open] .chev{transform:rotate(45deg)}
.tb{padding:4px 16px 16px;border-top:1px solid var(--line)}
.pts{margin:12px 0 4px;padding-left:1.15em}
.pts li{margin:0 0 10px;padding-left:2px}
.pts ul,.pts ol{margin:8px 0 2px;padding-left:1.2em}
.pts ol li,.pts ul ul li{margin-bottom:6px}
.pts li.wrap{list-style:none;margin-left:-1.15em}
.tip{margin:14px 0 4px;padding:11px 14px;border-left:5px solid var(--mark);background:color-mix(in srgb,var(--mark) 22%,var(--surface));border-radius:0 8px 8px 0}
.tip b{margin-right:4px}
.tact{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.empty{text-align:center;color:var(--dim);padding:28px 8px}

/* Praticar */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin;margin:0 -14px;padding-left:14px;padding-right:14px}
.chip{flex:none;min-height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;white-space:nowrap}
.chip i{font-style:normal;font-weight:400;margin-left:6px;opacity:.75;font-size:.88em}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.seg{display:flex;align-items:center;gap:2px;height:12px;margin:4px 0 8px}
.seg i{flex:1;height:10px;background:var(--line);border-radius:2px}
.seg i.ok{background:var(--ok)}
.seg i.no{background:var(--bad);height:5px}
.seg i.cur{outline:2px solid var(--accent);outline-offset:1px}
.qline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;margin-bottom:12px;flex-wrap:wrap}
.sts{display:flex;gap:8px}
.pill{padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.no{color:var(--bad);border-color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 16px}
.qmeta{color:var(--dim);font-size:.9rem;margin-bottom:6px}
.qtxt{font-size:1.25rem;line-height:1.3;margin-bottom:16px;font-weight:700}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:54px;padding:10px 12px;margin-bottom:10px;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.lt{flex:none;width:30px;height:30px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;background:var(--surface)}
.ot{flex:1;padding-top:2px}
.vd{display:block;font-style:normal;font-size:.85rem;font-weight:700;margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.right .lt{background:var(--ok);border-color:var(--ok);color:#fff}.opt.right .vd{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff}.opt.wrong .vd{color:var(--bad)}
.fb{margin:6px 0 4px;padding:12px 14px;border-radius:8px;border-left:5px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.no{background:var(--badbg);border-color:var(--bad)}
.fb b{display:block;margin-bottom:2px}
.nav2{display:flex;gap:10px;margin-top:16px}
.nav2 .btn{flex:1}.nav2 .btn.pri{flex:2}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--dim);font-size:.92rem}
.qfoot label{display:flex;gap:8px;align-items:center;min-height:44px;cursor:pointer}
.qfoot input{width:20px;height:20px;accent-color:var(--accent)}
.hint{display:none}
@media(hover:hover) and (min-width:800px){.hint{display:block;color:var(--dim);font-size:.88rem;margin-top:8px}}
.res{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 16px}
.res .big{font:800 3rem/1 var(--hd);letter-spacing:-.02em}
.res p{margin:6px 0 16px;color:var(--dim)}
.row{display:grid;grid-template-columns:minmax(96px,34%) 1fr 48px;align-items:center;gap:10px;margin:8px 0;font-size:.95rem}
.row .meter{height:10px}.row .meter i{background:var(--ok)}.row.low .meter i{background:var(--bad)}
.row span:last-child{text-align:right;font-weight:700}
.racts{display:flex;flex-direction:column;gap:10px;margin-top:20px}

/* Cola */
.cg{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden}
.cg h2{padding:13px 14px;font-size:1.1rem}
.cg dl{margin:0}
.cg dl>div{display:grid;grid-template-columns:minmax(100px,32%) 1fr;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.cg dt{font-weight:700}.cg dd{margin:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.95em}
.pair{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.pair>div{padding:10px 14px}.pair>div+div{border-left:1px solid var(--line)}
.pair b{display:block;font:700 1rem/1.3 var(--hd)}
.pair span{display:block;font-size:.95rem;line-height:1.4;margin-top:2px}

@media(max-width:420px){.row{grid-template-columns:90px 1fr 44px}.qtxt{font-size:1.18rem}.qcard{padding:16px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="hin">
  <h1>Engenharia de Software<small>Revisão para a prova</small></h1>
  <button class="ib" id="zbtn" aria-label="Mudar o tamanho do texto">Aa</button>
  <button class="ib" id="tbtn" aria-label="Alternar entre tema claro e escuro"></button>
</div></header>

<nav id="nav" role="tablist" aria-label="Seções">
  <button role="tab" data-tab="estudar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M8 7h8M8 11h6"/></svg>Estudar</button>
  <button role="tab" data-tab="praticar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Praticar</button>
  <button role="tab" data-tab="cola"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Cola rápida</button>
</nav>

<main>
<section id="p-estudar" class="panel" role="tabpanel">
  <div class="rv"><span id="rv-t"></span><div class="meter"><i id="rv-b"></i></div></div>
  <div class="srow">
    <input type="search" id="busca" placeholder="Buscar: Scrum, Gitflow, Nielsen…" aria-label="Buscar nos temas">
    <button class="btn" id="toggleall">Abrir todos</button>
  </div>
  <div id="topics"></div>
  <p class="empty" id="noresult" hidden>Nenhum tema com esse termo. Tente outra palavra.</p>
</section>

<section id="p-praticar" class="panel" role="tabpanel">
  <div class="chips" id="qchips" role="group" aria-label="Escolher tema"></div>
  <div class="seg" id="seg" aria-hidden="true"></div>
  <div class="qline"><span id="qpos"></span><span class="sts"><span class="pill ok" id="s-ok"></span><span class="pill no" id="s-no"></span></span></div>
  <div id="qbox"></div>
  <p class="hint">Atalhos: teclas 1 a 4 respondem, Enter avança, setas navegam.</p>
  <div class="qfoot"><label><input type="checkbox" id="shuf"> Embaralhar alternativas</label><button class="link" id="reset">Recomeçar tudo</button></div>
</section>

<section id="p-cola" class="panel" role="tabpanel"><div id="cola"></div></section>
</main>

<script>
const D={"topics": [{"id": 1, "s": "Qualidade", "title": "Qualidade e ISO 9126", "tag": "Qualidade é atender requisitos e necessidades do cliente", "items": ["**Software** = programas + estruturas de dados + informação descritiva (não é só código).", "**Engenharia de Software** = abordagem sistemática, disciplinada e quantificada.", "**Qualidade** = atender necessidades explícitas e implícitas (conformidade com requisitos).", "**GQA** avalia a qualidade do **processo e do produto** (auditoria, testes, gestão de mudanças). Modelos de processo: CMMI e MPS.BR.", {"t": "Visões de Garvin:", "sub": ["**Transcendental**: reconhecida, difícil de definir.", "**Usuário**: atende às necessidades do usuário.", "**Fabricante**: atende à especificação original.", "**Produto**: ligada às características do produto.", "**Valor**: quanto o cliente aceita pagar."]}, {"t": "ISO/IEC 9126 (6 atributos): **Funcionalidade, Confiabilidade, Usabilidade, Eficiência, Manutenibilidade, Portabilidade**.", "sub": ["Eficiência = tempo de resposta e recursos usados.", "Manutenibilidade = esforço para modificar e testar de novo.", "Portabilidade = adaptar a outros ambientes."]}, "**“Bom o suficiente”**: lançar uma V1.0 com limitações conhecidas já prevendo a V2.0, pesando risco e área de aplicação."]}, {"id": 2, "s": "Usabilidade", "title": "Usabilidade e heurísticas de Nielsen", "tag": "Facilidade de usar: 10 heurísticas", "items": ["**Ergonomia**: estudo das interações entre humanos e os demais elementos.", "**Usabilidade (ISO 9241)**: eficácia, eficiência e satisfação em um contexto específico.", {"ol": ["**Status do sistema**: dar feedback (“Salvando…”).", "**Mundo real**: linguagem familiar (lixeira).", "**Controle do usuário**: desfazer e abortar.", "**Consistência**: mesma ação, mesmo padrão.", "**Prevenção de erros**: confirmar antes de apagar.", "**Reconhecimento > recordação**: mostrar as opções.", "**Flexibilidade**: simples para iniciante, atalhos para avançado.", "**Minimalismo**: só a informação necessária.", "**Erros claros**: explicar o problema e como resolver.", "**Ajuda e documentação**: fácil de achar quando precisar."]}]}, {"id": 3, "s": "Ciclos", "title": "Ciclos de vida", "tag": "Cascata, incremental, evolutivo e espiral", "items": ["Ciclo de vida: da ideia ao produto final (a última fase é a deterioração e morte).", "**Cascata**: fases em sequência, com pontos de controle. É rígido e burocrático. Com realimentação, permite revisar a fase anterior.", "**Incremental**: entrega partes funcionais; a avaliação de cada incremento planeja o próximo.", "**Evolutivo**: protótipo evolutivo para entender e identificar requisitos; o produto cresce.", "**Espiral**: iterativo, cada ciclo termina com revisão; foco em **análise de riscos**."]}, {"id": 4, "s": "Testes", "title": "Níveis de teste", "tag": "Unidade, integração, sistema e aceitação", "items": ["Ordem: **unidade → integração → sistema → aceitação**.", "**Unidade**: menor parte (método ou classe), feito pelo desenvolvedor.", "**Integração**: junta componentes já testados e revela problemas que só aparecem em conjunto.", {"t": "**Sistema**: sistema inteiro, em ambiente parecido com o de produção. Inclui:", "sub": ["**Recuperação**: força falhas e vê se recupera (com intervenção humana, mede o tempo médio de reparo).", "**Segurança**: tornar o custo da invasão maior que o valor da informação.", "**Stress**: carga ou volume anormal, até onde o sistema aguenta.", "**Desempenho**: confere os requisitos de desempenho em execução.", "**Disponibilização**: funciona nos vários ambientes de hardware e software."]}, "**Aceitação**: o cliente ou usuário valida os requisitos.", "**Alfa**: grupo selecionado, ambiente controlado, a equipe observa. **Beta**: clientes, ambiente não controlado, o cliente registra os problemas.", "**Tabela de decisão**: condições + ações + regras (combinações de condições) para criar casos de teste a partir de regras de negócio."], "tip": "Stress não é teste de segurança, e desempenho não é igual a stress (desempenho confere requisitos; stress força condições anormais)."}, {"id": 5, "s": "Ágil", "title": "Manifesto Ágil", "tag": "Quatro valores: o da esquerda vale mais", "items": [{"ol": ["**Indivíduos e interações** mais que processos e ferramentas.", "**Software funcionando** mais que documentação abrangente.", "**Colaboração com o cliente** mais que negociação de contratos.", "**Responder a mudanças** mais que seguir um plano."]}, "Mudanças são bem-vindas, mesmo tardias. Entregas frequentes e curtas.", "Negócio e desenvolvedores trabalham juntos todos os dias.", "Software funcionando é a medida de progresso. Ritmo sustentável.", "Simplicidade = maximizar o trabalho não realizado. Equipes auto-organizáveis que refletem e se ajustam."], "tip": "O manifesto não diz que documentação é inútil: ele valoriza mais o item da esquerda."}, {"id": 6, "s": "Scrum", "title": "Scrum", "tag": "Pilares, valores e papéis", "items": ["**Framework** ágil, empírico e iterativo (Jeff Sutherland; o nome vem do rugby).", "**3 pilares**: Transparência, Inspeção, Adaptação.", "**5 valores**: Compromisso, Foco, Abertura, Respeito, Coragem.", "**Product Owner (PO)**: domínio do negócio; diz **o que** fazer; ordena o Product Backlog.", "**Time de desenvolvimento**: domínio técnico; diz **como** fazer; auto-organizável, 3 a 9 pessoas, multidisciplinar.", "**Scrum Master**: facilita e garante o Scrum conforme o Guia.", "**História de usuário**: “Eu como <usuário> quero <recurso> para <razão>.”", "**Sprint**: iteração de 2 a 4 semanas."], "tip": "Pilares (3) não são os valores (5)."}, {"id": 7, "s": "Eventos e DoD", "title": "Eventos, artefatos, backlog e DoD", "tag": "Planning, Daily, Review, Retrospectiva", "items": [{"t": "**3 artefatos**:", "sub": ["**Product Backlog**: lista priorizada do produto; evolui com o feedback.", "**Sprint Backlog**: tarefas que o time vai fazer na Sprint (criado na Planning).", "**Incremento**: o entregável, o artefato mais importante."]}, {"t": "**4 eventos**:", "sub": ["**Planning**: alinha a entrega e cria o Sprint Backlog.", "**Daily**: 15 minutos (o que fez, o que fará, dificuldades).", "**Review**: olha o **produto** e coleta feedback.", "**Retrospectiva**: olha o **processo** e gera melhorias."]}, "**Priorizar** porque tempo, equipe e orçamento são limitados. **Impacto × Esforço** compara benefício com esforço.", "**MoSCoW**: **Must** (obrigatório), **Should** (importante), **Could** (desejável), **Won’t** (fora deste ciclo).", "**DoD** (Definição de Pronto): entendimento compartilhado do que é “concluído”, definido **antes da Sprint**, com visão técnica e de negócio.", "Item que não cumpre a DoD não é liberado, não vai à Review e volta ao Product Backlog."], "tip": "Review = produto. Retrospectiva = processo."}, {"id": 8, "s": "Manutenção", "title": "Manutenção e gestão de configuração", "tag": "Quatro tipos de manutenção e controle de mudanças", "items": ["**Corretiva**: corrige defeito (não muda requisitos).", "**Evolutiva**: melhoria pedida pelo usuário (muda requisitos).", "**Adaptativa**: adequa ao negócio (muda requisitos).", "**Preventiva**: melhora o interno, como desempenho, robustez e segurança (não muda requisitos).", "Manutenção pesa de 40% a 80% do custo do software, e a maior parte é evolutiva. **Manutenibilidade** = facilidade de corrigir, adaptar ou melhorar.", "**Gestão de configuração**: identificar, organizar e controlar as mudanças. Toda mudança é analisada, registrada, comunicada e controlada.", "Sem ela, a versão antiga pode sobrescrever a nova e artefatos se perdem. Com ela, há **rastreabilidade**: quem, quando e por quê."], "tip": "Gestão de configuração não impede mudanças e não é só controle de versão."}, {"id": 9, "s": "Gitflow e OKR", "title": "Gitflow, OKR e métricas", "tag": "Branches, objetivos e indicadores", "items": [{"t": "**Gitflow**:", "sub": ["**main**: lançamento oficial.", "**develop**: integração dos recursos.", "**feature**: um recurso novo por eto."}, "c": "C", "e": "Gestão de configuração não impede mudanças; controla e rastreia.", "t": 8}, {"n": 88, "q": "No Gitflow, a branch main:", "o": {"A": "Integra features em desenvolvimento.", "B": "Guarda o histórico do lançamento oficial.", "C": "É criada para cada usuário.", "D": "Só serve para testes unitários."}, "c": "B", "e": "main mantém o histórico do lançamento oficial.", "t": 9}, {"n": 91, "q": "Depois que a branch release é criada:", "o": {"A": "Novos recursos entram normalmente.", "B": "Nenhuma atividade pode ocorrer.", "C": "Ficam apenas tarefas relacionadas ao lançamento, como segurança e documentação; novos recursos não são adicionados.", "D": "A branch vira Product Backlog."}, "c": "C", "e": "Release é estabilização/preparação do lançamento, sem novos recursos.", "t": 9}, {"n": 93, "q": "Em OKR, Objective é:", "o": {"A": "Quantitativo e mensurável.", "B": "Qualitativo: o que queremos alcançar.", "C": "O custo do cliente.", "D": "O número de bugs."}, "c": "B", "e": "Objective é qualitativo e descreve onde se quer chegar.", "t": 9}, {"n": 95, "q": "Segundo os slides, um objetivo de OKR pode ter no máximo:", "o": {"A": "2 Key Results.", "B": "3 Key Results.", "C": "4 Key Results.", "D": "5 Key Results."}, "c": "C", "e": "Cada objetivo pode ter no máximo 4 KRs.", "t": 9}, {"n": 98, "q": "Qual opção associa corretamente a métrica?", "o": {"A": "Churn = custo de aquisição.", "B": "CAC = custo de aquisição do cliente.", "C": "NPS = taxa de abandono.", "D": "Conversão = número de branches."}, "c": "B", "e": "CAC significa custo de aquisição do cliente.", "t": 9}], "cola": [{"t": "Pares que confundem", "pairs": [[["Review", "produto e feedback"], ["Retrospectiva", "processo e melhorias"]], [["Pilares", "transparência, inspeção, adaptação"], ["Valores", "compromisso, foco, abertura, respeito, coragem"]], [["Product Owner", "o que fazer; ordena o backlog"], ["Time", "como fazer; execução técnica"]], [["Product Backlog", "lista do produto"], ["Sprint Backlog", "tarefas da Sprint"]], [["Stress", "carga anormal, vai até falhar"], ["Desempenho", "confere requisitos de desempenho"]], [["Alfa", "controlado e observado"], ["Beta", "clientes, não controlado"]], [["Objective", "qualitativo"], ["Key Result", "quantitativo"]]]}, {"t": "Ordens e números para decorar", "rows": [["ISO 9126", "Funcionalidade, Confiabilidade, Usabilidade, Eficiência, Manutenibilidade, Portabilidade (**FCUEMP**)"], ["Testes", "unidade, integração, sistema, aceitação"], ["Nielsen", "status, mundo real, controle, consistência, prevenção, reconhecimento, flexibilidade, minimalismo, erros, ajuda"], ["Eventos", "Planning, Daily, Review, Retrospectiva"], ["Artefatos", "Product Backlog, Sprint Backlog, Incremento"], ["Números", "Daily **15 min** · Sprint **2 a 4 semanas** · time **3 a 9** · até **5** objetivos · até **4** KRs · **3 meses**"]]}, {"t": "Ciclos de vida", "rows": [["Cascata", "sequência e rigidez"], ["Incremental", "entrega por partes"], ["Evolutivo", "protótipo e crescimento"], ["Espiral", "iteração e **risco**"]]}, {"t": "Manutenção", "rows": [["Corretiva", "corrige defeito"], ["Evolutiva", "melhora ou adiciona"], ["Adaptativa", "adequa ao negócio"], ["Preventiva", "melhora o interno"], ["Dica", "corretiva e preventiva **não** mudam requisitos; evolutiva e adaptativa mudam"]]}, {"t": "Gitflow", "mono": true, "rows": [["main", "oficial"], ["develop", "integração"], ["feature", "recurso novo"], ["release", "preparar lançamento"], ["hotfix", "correção urgente"]]}, {"t": "Métricas", "rows": [["NPS", "satisfação"], ["Churn", "abandono"], ["CAC", "custo de aquisição"], ["Conversão", "% que faz a ação"], ["Engajamento", "tempo de uso e cliques"]]}]};

    const n=D.qs.filter(q=>q.t===t.id).length,r=!!S.rev[t.id];
    return `<details class="topic${r?' rev':''}" id="t${t.id}" ${S.open[t.id]?'open':''}>
<summary><button class="chk" data-rev="${t.id}" aria-pressed="${r}" aria-label="Marcar “${esc(t.title)}” como revisado">${CHECK}</button><span class="tt"><b>${esc(t.title)}</b><span>${esc(t.tag)}</span></span><span class="chev" aria-hidden="true"></span></summary>
<div class="tb"><ul class="pts">${t.items.map(li).join('')}</ul>${t.tip?`<div class="tip"><b>Pegadinha:</b>${rich(t.tip)}</div>`:''}
<div class="tact"><button class="btn pri" data-train="${t.id}">Treinar este tema (${n} questões)</button><button class="btn revbtn" data-rev="${t.id}"></button></div></div></details>`}).join('');
  D.topics.forEach(t=>updRev(t.id));
  progRev();
}
function updRev(id){
  const r=!!S.rev[id],el=$('#t'+id);
  el.classList.toggle('rev',r);
  el.querySelector('.chk').setAttribute('aria-pressed',r);
  el.querySelector('.revbtn').textContent=r?'Revisado ✓ (desmarcar)':'Marcar como revisado';
}
function progRev(){
  const n=D.topics.filter(t=>S.rev[t.id]).length,t=D.topics.length;
  $('#rv-t').textContent=`${n} de ${t} revisados`;$('#rv-b').style.width=(n/t*100)+'%';
}
function toggleRev(id){S.rev[id]=!S.rev[id];save();updRev(id);progRev()}
$('#topics').addEventListener('click',e=>{
  const r=e.target.closest('[data-rev]');
  if(r){e.preventDefault();e.stopPropagation();toggleRev(r.dataset.rev);return}
  const tr=e.target.closest('[data-train]');
  if(tr){S.topic=tr.dataset.train;S.pos=firstOpen(qlist());save();showTab('praticar');renderQuiz()}
});
$('#topics').addEventListener('toggle',e=>{
  const d=e.target;if(d.classList&&d.classList.contains('topic')){S.open[d.id.slice(1)]=d.open;save()}
},true);
$('#toggleall').onclick=()=>{
  const ds=$$('.topic').filter(d=>d.style.display!=='none'),any=ds.some(d=>!d.open);
  ds.forEach(d=>d.open=any);
  $('#toggleall').textContent=any?'Fechar todos':'Abrir todos';
};
$('#busca').addEventListener('input',e=>{
  const q=norm(e.target.value.trim());let n=0;
  $$('.topic').forEach(d=>{
    const hit=q.length<2||norm(d.textContent).includes(q);
    d.style.display=hit?'':'none';
    if(hit)n++;
    if(hit&&q.length>=2)d.open=true;
  });
  $('#noresult').hidden=n>0;
});

/* ---------- PRATICAR ---------- */
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const qlist=()=>D.qs.filter(q=>S.topic==='all'||String(q.t)===S.topic);
const firstOpen=l=>{const i=l.findIndex(q=>!S.ans[q.n]);return i<0?l.length:i};
function order(q){
  const L=Object.keys(q.o);if(!S.shuf)return L;
  const r=rnd(q.n*7919+S.seed*104729);
  for(let i=L.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[L[i],L[j]]=[L[j],L[i]]}
  return L;
}
const chip=(id,label,qs)=>`<button class="chip" data-topic="${id}" aria-pressed="${S.topic===id}">${esc(label)}<i>${qs.filter(q=>S.ans[q.n]).length}/${qs.length}</i></button>`;
function renderQuiz(){
  const list=qlist(),L=list.length;
  S.pos=Math.max(0,Math.min(S.pos,L));
  $('#qchips').innerHTML=chip('all','Todos',D.qs)+D.topics.map(t=>chip(String(t.id),t.s,D.qs.filter(q=>q.t===t.id))).join('');
  const act=$('#qchips .chip[aria-pressed=true]');if(act)act.scrollIntoView({inline:'center',block:'nearest'});
  $('#seg').innerHTML=list.map((q,i)=>{const a=S.ans[q.n];return `<i class="${a?(a===q.c?'ok':'no'):''}${i===S.pos?' cur':''}"></i>`}).join('');
  const ok=list.filter(q=>S.ans[q.n]===q.c).length,no=list.filter(q=>S.ans[q.n]&&S.ans[q.n]!==q.c).length;
  $('#s-ok').textContent='✓ Acertos: '+ok;$('#s-no').textContent='✕ Erros: '+no;
  $('#qpos').textContent=S.pos<L?`Questão ${S.pos+1} de ${L}`:'Resultado';
  $('#shuf').checked=S.shuf;
  if(S.pos>=L){$('#qbox').innerHTML=resultHtml(list,ok,no);return}
  const q=list[S.pos],a=S.ans[q.n],ord=order(q);
  $('#qbox').innerHTML=`<article class="qcard" aria-labelledby="qt">
<div class="qmeta">${esc(TOP[q.t].title)}</div>
<h2 class="qtxt" id="qt">${esc(q.q)}</h2>
<div>${ord.map((k,i)=>{let c='',v='';if(a){if(k===q.c){c=' right';v='Correta'}else if(k===a){c=' wrong';v='Sua resposta'}}
 return `<button class="opt${c}" data-k="${k}" ${a?'disabled':''}><span class="lt">${'ABCD'[i]}</span><span class="ot">${esc(q.o[k])}${v?`<em class="vd">${v}</em>`:''}</span></button>`}).join('')}</div>
${a?`<div class="fb ${a===q.c?'ok':'no'}" id="fb" role="status"><b>${a===q.c?'Correto':'Incorreto'}</b>${esc(q.e)}</div>`:''}
<div class="nav2"><button class="btn" id="prev" ${S.pos?'':'disabled'}>Anterior</button><button class="btn${a?' pri':''}" id="next">${a?(S.pos===L-1?'Ver resultado':'Próxima'):'Pular'}</button></div></article>`;
}
function resultHtml(list,ok,no){
  const L=list.length,left=L-ok-no,pc=Math.round(ok/L*100);
  const rows=D.topics.map(t=>{const g=list.filter(q=>q.t===t.id);if(!g.length)return null;
    const c=g.filter(q=>S.ans[q.n]===q.c).length,p=Math.round(c/g.length*100);return {t,c,n:g.length,p}}).filter(Boolean);
  const weak=rows.filter(r=>r.p<70).map(r=>r.t.s);
  return `<div class="res"><div class="big">${ok} de ${L}</div>
<p>${pc}% de acerto${left?`, ${left} sem resposta`:''}.${weak.length&&!left?` Vale rever: ${esc(weak.join(', '))}.`:''}${!weak.length&&!left?' Ótimo resultado.':''}</p>
${rows.map(r=>`<div class="row${r.p<70?' low':''}"><span>${esc(r.t.s)}</span><div class="meter"><i style="width:${r.p}%"></i></div><span>${r.c}/${r.n}</span></div>`).join('')}
<div class="racts">
${left?`<button class="btn pri" data-act="missing">Responder as ${left} que faltam</button>`:''}
${no?`<button class="btn${left?'':' pri'}" data-act="retry">Refazer só os ${no} erros</button>`:''}
${S.topic!=='all'?`<button class="btn" data-act="all">Ver todos os temas</button>`:''}
<button class="btn" data-act="study">Voltar a estudar</button></div></div>`;
}
function answer(n,k){if(S.ans[n])return;S.ans[n]=k;save();renderQuiz();const f=$('#fb');if(f)f.scrollIntoView({block:'nearest',behavior:'smooth'})}
function go(d){S.pos+=d;save();renderQuiz();scrollTo({top:0})}
$('#qbox').addEventListener('click',e=>{
  const o=e.target.closest('.opt');
  if(o){const q=qlist()[S.pos];answer(q.n,o.dataset.k);return}
  if(e.target.closest('#next')){go(1);return}
  if(e.target.closest('#prev')){go(-1);return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const list=qlist();
  if(a.dataset.act==='missing'){S.pos=firstOpen(list);save();renderQuiz();scrollTo({top:0})}
  if(a.dataset.act==='retry'){list.forEach(q=>{if(S.ans[q.n]&&S.ans[q.n]!==q.c)delete S.ans[q.n]});S.seed++;S.pos=firstOpen(list);save();renderQuiz();scrollTo({top:0})}
  if(a.dataset.act==='all'){S.topic='all';S.pos=firstOpen(qlist());save();renderQuiz();scrollTo({top:0})}
  if(a.dataset.act==='study'){showTab('estudar')}
});
$('#qchips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  S.topic=c.dataset.topic;S.pos=firstOpen(qlist());save();renderQuiz();
});
$('#shuf').onchange=e=>{S.shuf=e.target.checked;save();renderQuiz()};
$('#reset').onclick=()=>{
  if(!confirm('Apagar todas as respostas e recomeçar?'))return;
  S.ans={};S.pos=0;S.seed=(Math.random()*1e6)|0;save();renderQuiz();scrollTo({top:0});
};
addEventListener('keydown',e=>{
  if(S.tab!=='praticar'||e.metaKey||e.ctrlKey||e.altKey||e.target.closest('input,select,textarea'))return;
  const list=qlist();if(S.pos>=list.length)return;
  const q=list[S.pos],k=e.key.toLowerCase(),i=('1234'+'abcd').indexOf(k);
  if(k.length===1&&i>=0&&!S.ans[q.n]){answer(q.n,order(q)[i%4]);return}
  if(k==='enter'&&!e.target.closest('button')&&S.ans[q.n]){go(1);return}
  if(k==='arrowright'&&S.ans[q.n]){go(1)}
  if(k==='arrowleft'&&S.pos>0){go(-1)}
});

/* ---------- COLA ---------- */
function renderCola(){
  $('#cola').innerHTML=D.cola.map(g=>`<section class="cg"><h2>${esc(g.t)}</h2>`+
    (g.pairs?g.pairs.map(p=>`<div class="pair">${p.map(c=>`<div><b>${esc(c[0])}</b><span>${rich(c[1])}</span></div>`).join('')}</div>`).join('')
    :`<dl>${g.rows.map(r=>`<div><dt${g.mono?' class="mono"':''}>${esc(r[0])}</dt><dd>${rich(r[1])}</dd></div>`).join('')}</dl>`)+`</section>`).join('');
}

prefs();renderStudy();renderQuiz();renderCola();showTab(S.tab,true);
</script>
</body>
</html>
