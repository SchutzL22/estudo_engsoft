$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.t));scrollTo({top:0})});

/* ---------- ESTUDO ---------- */
const fmt=it=>{
  if(it.t==='call')return `<div class="call"><b>${esc(it.label)}:</b> ${esc(it.text)}</div>`;
  const inner=(it.label?`<b class="l">${esc(it.label)}</b> `:'')+esc(it.text);
  return it.t==='li'?`<li>${inner}</li>`:`<p>${inner}</p>`;
};
const secHtml=s=>{let h='',ul=false;s.items.forEach(it=>{if(it.t==='li'&&!ul){h+='<ul>';ul=true}if(it.t!=='li'&&ul){h+='</ul>';ul=false}h+=fmt(it)});if(ul)h+='</ul>';return `<div class="sec"><h3>${esc(s.title)}</h3>${h}</div>`};
function renderAulas(){
  $('#aulas').innerHTML=D.aulas.map(a=>`<details class="aula" id="a${a.id}" ${S.open[a.id]?'open':''}><summary><span class="badge">Tema ${a.id}</span><h2>${esc(a.title)}</h2><span class="chev">▶</span></summary><div class="body">${a.secs.map(secHtml).join('')}<label class="done"><input type="checkbox" data-a="${a.id}" ${S.done[a.id]?'checked':''}> Marcar tema como revisado</label></div></details>`).join('');
  $$('#aulas details').forEach(d=>d.addEventListener('toggle',()=>{S.open[d.id.slice(1)]=d.open;save()}));
  $$('.done input').forEach(c=>c.onchange=()=>{S.done[c.dataset.a]=c.checked;save();studyProg()});
  $('#aulachips').innerHTML=D.aulas.map(a=>`<button class="chip" data-a="${a.id}">Tema ${a.id}</button>`).join('')+'<button class="chip" data-a="resumao">⚡ Resumão</button><button class="chip" data-a="macetes">💡 Macetes</button>';
  $$('#aulachips .chip').forEach(c=>c.onclick=()=>{const el=$('#'+(isNaN(c.dataset.a)?c.dataset.a:'a'+c.dataset.a));el.open=true;el.scrollIntoView({behavior:'smooth'})});
  const ql=r=>{const i=r.search(/ = |: /);return i>0?`<li><b>${esc(r.slice(0,i))}</b>${esc(r.slice(i))}</li>`:`<li>${esc(r)}</li>`};
  $('#frase').textContent='“'+D.frase+'”';$('#rlist').innerHTML=D.resumo.map(ql).join('');
  $('#mlist').innerHTML=D.macetes.map((m,i)=>`<li><b>${i+1}.</b> ${esc(m)}</li>`).join('');
  studyProg();
}
function studyProg(){const n=D.aulas.filter(a=>S.done[a.id]).length,t=D.aulas.length,p=Math.round(n/t*100);$('#sp-t').textContent=`${n} de ${t} temas revisados`;$('#sp-p').textContent=p+'%';$('#sp-b').style.width=p+'%'}
let bt;$('#busca').oninput=e=>{clearTimeout(bt);bt=setTimeout(()=>search(e.target.value.trim()),180)};
function search(q){
  $$('#aulas mark').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));
  $$('.sec').forEach(s=>s.style.display='');$$('.aula').forEach(a=>a.style.display='');
  if(q.length<2)return;
  const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
  $$('#aulas .aula').forEach(a=>{let any=false;
    a.querySelectorAll('.sec').forEach(s=>{if(re.test(s.textContent)){any=true;re.lastIndex=0;
      const w=document.createTreeWalker(s,NodeFilter.SHOW_TEXT),nodes=[];while(w.nextNode())nodes.push(w.currentNode);
      nodes.forEach(n=>{if(re.test(n.nodeValue)){re.lastIndex=0;const sp=document.createElement('span');sp.innerHTML=esc(n.nodeValue).replace(new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),m=>`<mark class="hl">${m}</mark>`);n.replaceWith(sp)}re.lastIndex=0})
    }else s.style.display='none';re.lastIndex=0});
    a.style.display=any?'':'none';if(any)a.open=true});
}

/* ---------- QUESTÕES ---------- */
let fa='all';
const rnd=seed=>{let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
function order(q){const L=['A','B','C','D','E'];if(!S.shuf)return L;const r=rnd(q.n*7919+S.seed*104729);const a=[...L];for(let i=4;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQ(){
  const list=D.qs.filter(q=>(fa==='all'||String(q.a)===fa)&&($('#status').value==='all'||($('#status').value==='open'&&!S.ans[q.n])||($('#status').value==='err'&&S.ans[q.n]&&S.ans[q.n]!==q.c)));
  $('#qlist').innerHTML=list.length?list.map(q=>{const a=S.ans[q.n];const o=order(q);
    return `<div class="card q" id="q${q.n}"><div class="qh"><div class="qn">${q.n}</div><div><span class="tag">${AN[q.a]}</span><div class="qt">${esc(q.q)}</div></div></div><div class="opts">${o.map((L,i)=>{let c='';if(a){if(L===q.c)c='right';else if(L===a)c='wrong'}return `<button class="opt ${c}" data-q="${q.n}" data-l="${L}" ${a?'disabled':''}><span class="lt">${'ABCDE'[i]}</span><span>${esc(q.o[L])}</span></button>`}).join('')}</div>${a?fbHtml(q,a):''}</div>`}).join(''):'<div class="empty">Nenhuma questão neste filtro. 🎉</div>';
  $$('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.q,b.dataset.l));
  qStats();
}
const fbHtml=(q,a)=>{const ok=a===q.c;return `<div class="fb show ${ok?'ok':'no'}"><b>${ok?'✅ Correto!':'❌ Incorreto.'}</b>${ok?'':'Correta: '+esc(q.o[q.c])+'<br>'}<span style="color:var(--dim)">${esc(q.e)}</span></div>`};
function answer(n,l){if(S.ans[n])return;S.ans[n]=l;save();
  const q=D.qs.find(x=>x.n===n),card=$('#q'+n);
  card.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.l===q.c)b.classList.add('right');else if(b.dataset.l===l)b.classList.add('wrong')});
  card.insertAdjacentHTML('beforeend',fbHtml(q,l));qStats()}
function qStats(){
  const t=D.qs.length,n=Object.keys(S.ans).length,ok=D.qs.filter(q=>S.ans[q.n]===q.c).length,p=Math.round(n/t*100);
  $('#qp-t').textContent=`${n} / ${t} respondidas`;$('#qp-p').textContent=p+'%';$('#qp-b').style.width=p+'%';
  $('#n-ok').textContent=ok;$('#n-no').textContent=n-ok;$('#n-pct').textContent=n?`${Math.round(ok/n*100)}% de acerto`:'—';
  const r=$('#result');
  if(n===t){const rows=Object.keys(AN).map(k=>{const g=D.qs.filter(q=>String(q.a)===k),c=g.filter(q=>S.ans[q.n]===q.c).length,pc=Math.round(c/g.length*100);return `<div class="row"><span>${AN[k]}</span><div class="bar"><i style="width:${pc}%"></i></div><span>${c}/${g.length}</span></div>`}).join('');
    r.style.display='block';r.innerHTML=`<div class="big">${Math.round(ok/t*100)}%</div><h2>Simulado concluído!</h2><p style="color:var(--dim)">Você acertou ${ok} de ${t}. Revise os temas com menor desempenho:</p><div style="text-align:left;max-width:460px;margin:auto">${rows}</div><p><button class="btn p" id="errs">Revisar só os erros</button></p>`;
    $('#errs').onclick=()=>{$('#status').value='err';renderQ();scrollTo({top:0})}}
  else r.style.display='none';
}
$('#qchips').innerHTML='<button class="chip on" data-a="all">Todas</button>'+Object.keys(AN).map(k=>`<button class="chip" data-a="${k}">${AN[k]}</button>`).join('');
$$('#qchips .chip').forEach(c=>c.onclick=()=>{fa=c.dataset.a;$$('#qchips .chip').forEach(x=>x.classList.toggle('on',x===c));renderQ()});
$('#status').onchange=renderQ;
$('#shuf').checked=S.shuf;$('#shuf').onchange=e=>{S.shuf=e.target.checked;save();renderQ()};
$('#reset').onclick=()=>{if(!confirm('Apagar todas as respostas e recomeçar?'))return;S.ans={};S.seed=(Math.random()*1e6)|0;save();$('#status').value='all';renderQ();scrollTo({top:0})};

/* topo */
addEventListener('scroll',()=>{$('#top').style.display=scrollY>600?'block':'none'},{passive:true});
$('#top').onclick=()=>scrollTo({top:0});

renderAulas();renderQ();
</script>
</body>
</html>
